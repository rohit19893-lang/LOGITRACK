}
// Resolves the Freight Challan already linked to this Bilty, if any exists yet (via its source Loading
// Challan, Path 2 — Loading Challan → Bilty → Freight Challan) — used so the POD Module can be found/opened
// under either linked id without creating a duplicate record.
function biltyLinkedFreightChallanId(b){
  if(!b.sourceChallanId) return '';
  const srcCh = loadingChallans.find(c=>c.id===b.sourceChallanId);
  return (srcCh && srcCh.linkedFreightChallanId) ? srcCh.linkedFreightChallanId : '';
}
// Bug fix (Round 23e): the Round 23 fix only carried a Bilty's Advances into its Freight Challan at the
// MOMENT the Freight Challan was created — adding or editing an Advance on the Bilty afterwards (a very
// normal order of events: book the truck, create the Freight Challan, then remember to log the advance on
// the Bilty) never reached an already-existing Freight Challan. Called from saveBilty() every time, this
// removes whatever was previously carried in (tagged fromBilty:true) and re-adds a fresh copy of the
// Bilty's current Advances, so the two always match — without touching any advance the owner added
// directly on the Freight Challan itself (those are never tagged fromBilty, so they're left alone).
function syncBiltyAdvancesToFreightChallan(b){
  const fcId = biltyLinkedFreightChallanId(b);
  const f = fcId ? freightChallans.find(x=>x.id===fcId) : null;
  if(!f) return;
  const ownAdvances = (f.advances||[]).filter(a=>!a.fromBilty);
  const freshFromBilty = (b.advances||[]).map(a=>({mode:a.mode||'Cash', amount:a.amount, givenBy:'', date:a.date||f.date, paidTo:'Driver', fromBilty:true}));
  f.advances = [...ownAdvances, ...freshFromBilty];
}


/* ================= FREIGHT CHALLAN (truck account / hisab) — rebuilt Round 16 =================
   Always derived from a Loading Challan — either directly (no Bilty needed), or after a Bilty has been
   made from that Loading Challan. Never created standalone. Tracks the truck's own settlement — what we
   owe the truck (driver/owner) vs. what's actually been paid or recovered, after Commission, Margin
   (Booking Rate vs. Hire Rate), Other Expenses, Munshiyana, Halting, Kanta Charges, Dala, and Shortage
   are accounted for.

   Two branches by Payment Type (owner's Round 16 framing):
   - **To-Pay**: the party (per Freight Paid By) pays the driver the full freight directly at delivery, so
     WE need to RECOVER the difference — our Commission, the margin between Booking Rate and Hire Rate, and
     any other adjustments — from the driver. Tracked in the `recoveries` ledger.
   - **Paid / To-Be-Billed**: we pay the driver ourselves out of pocket, regardless of when/whether the
     party has paid or will pay us. What we're owed back from the party is a SEPARATE hisab, tracked in a
     future module — this Freight Challan only tracks the truck side. Tracked in the `payments` ledger.

   `podReceived` mirrors the Bilty's own Trip Completed (POD) flag — the ledger-entry actions (adding a
   Payment/Recovery entry, or marking fully settled) only unlock once POD is marked received, since the
   real hisab can't be finalized before delivery is confirmed. The computed figures still show live as a
   running estimate before that, so the numbers are visible while the load is still in transit. */
function createFreightChallanFromChallan(challanId, biltyId, startInfo){
  const ch = loadingChallans.find(c=>c.id==challanId);
  if(!ch) return;
  if(ch.linkedFreightChallanId){
    // already exists — just open it (both paths converge on the same Freight Challan per Loading Challan)
    openFreightChallanDetail(ch.linkedFreightChallanId);
    screen = 'freightChallanDetail';
    render();
    return;
  }
  const linkedBilty = biltyId ? bilties.find(b=>b.id==biltyId) : null;
  // Payment Type (how the truck is to be paid / how the party is billed) and Freight Paid By (which party
  // role actually settles the freight) are decided upfront — carried automatically from the Bilty when one
  // exists (Path 2), or supplied via the "Start Freight Challan" screen when there's no Bilty (Path 1).
  let paymentType, freightPaidByRole, freightPaidByOtherLabel;
  if(linkedBilty){
    paymentType = linkedBilty.paymentType || 'To-Be-Billed';
    freightPaidByRole = linkedBilty.freightPaidByRole || 'Consignor';
    freightPaidByOtherLabel = linkedBilty.freightPaidByOtherLabel || '';
  } else if(startInfo){
    paymentType = startInfo.paymentType;
    freightPaidByRole = startInfo.freightPaidByRole;
    freightPaidByOtherLabel = startInfo.freightPaidByOtherLabel || '';
  }
  // Final Load Weight: the Loading Challan's own Weight was only ever a booking-time record sent to the
  // party, never the final one (per owner's Round 20 clarification). When a Bilty exists, its Goods Weight
  // (entered/corrected on the Bilty itself) is the real final weight; with no Bilty, the Loading Challan's
  // weight is used as a starting point but is now directly editable on this Freight Challan's own Settlement
  // screen, since that's where the final figure gets confirmed for a no-Bilty booking.
  const biltyWeight = linkedBilty ? linkedBilty.goods.reduce((s,g)=>s+(Number(g.weight)||0),0) : 0;
  const finalLoadWeight = (linkedBilty && biltyWeight>0) ? String(biltyWeight) : (ch.weight||'');
  // Bug fix (Round 23): a POD can be marked Received against the Bilty BEFORE its Freight Challan even
  // exists (the two aren't created in a fixed order) — syncPodToLinkedDocs() only ever updates a Freight
  // Challan that's already linked at the time the POD is saved, so a POD marked first never reached the
  // Freight Challan that gets created afterwards. Look up any existing standalone POD record here, at
  // creation time, so its Unload Weight/POD status/Note carry straight into the new record.
  const existingPod = linkedBilty ? findPodRecord(linkedBilty.id, null) : null;
  const podUnloadWeight = existingPod && existingPod.status==='Received' ? (existingPod.receivedWeight||'') : '';
  // Bug fix (Round 23): a cash Advance entered on the Bilty (e.g. ₹10,000 given to the driver at loading)
  // never carried over into the Freight Challan's own Advances list, so it silently dropped out of the
  // freight settlement calculation. Convert each Bilty advance {mode, amount, date} into the Freight
  // Challan's advance shape {mode, amount, givenBy, date, paidTo} — paidTo defaults to 'Driver' (advances
  // at loading time are conventionally handed to the driver) and stays fully editable here. Tagged
  // `fromBilty:true` so a later edit to the Bilty's own Advances (Round 23e) can re-sync just this carried
  // subset without touching any advance added directly on the Freight Challan itself.
  const carriedAdvances = linkedBilty && linkedBilty.advances && linkedBilty.advances.length
    ? linkedBilty.advances.map(a=>({mode:a.mode||'Cash', amount:a.amount, givenBy:'', date:a.date||ch.date, paidTo:'Driver', fromBilty:true}))
    : [];
  const rec = {
    id: nextId.freight++,
    serialNo: 'FC-'+(3000+nextId.freight-1),
    date: new Date().toISOString().slice(0,10),
    loadingChallanId: ch.id, biltyId: biltyId||'',
    // Truck may only be a free-text number on the Loading Challan (Path 1, no Bilty in between) — carry
    // the number forward too so this Freight Challan doesn't just show a blank truck with no way to tell
    // which booking it was.
    truckId: ch.truckId||'', truckNumber: ch.truckId ? '' : (ch.truckNumber||''), driverMobile: ch.driverMobile, ownerMobile: ch.ownerMobile, ownerName: ch.ownerName||'',
    hireRate: ch.hireRate, hireRateType: ch.hireRateType||'PerMT', bookingRate: ch.bookingRate, bookingRateType: ch.bookingRateType||'PerMT',
    loadWeight: finalLoadWeight, unloadWeight: podUnloadWeight, shortageTolerance:'0', cuttingRate:'0',
    charges: [],
    advances: carriedAdvances,
    tdsAmount:'0', tdsMode:'Fixed', tdsPct:'0', dieselAmount:'0', dieselPump:'',
    // Supplier defaults from whatever was already linked on the Loading Challan (Party Master, Type =
    // Supplier — redesigned Round 21) — still fully editable here, since the same truck can arrive under a
    // different supplier on a different trip.
    supplierId: ch.supplierId||'', supplierName: ch.supplierName||'',
    // Round 23r: auto-fetch a Broker from whichever upstream record already has one entered — the Bilty's own
    // Third Party field (labeled "optional — broker, referral, etc." on that form) takes priority as the more
    // specific, per-Bilty source; the Loading Challan's own Broker field (added Round 23q) is the fallback when
    // there's no Bilty yet, or its Third Party was left blank. Still fully editable here either way — this is
    // just a starting point, not a lock.
    brokerId: (linkedBilty && linkedBilty.thirdPartyId) ? linkedBilty.thirdPartyId : (ch.loadBrokerId||''),
    brokerName: (linkedBilty && linkedBilty.thirdPartyId) ? (findName(parties, linkedBilty.thirdPartyId)||'') : (ch.loadBrokerName||''),
    // Consignor/Consignee: carried automatically from the Bilty when one exists (Path 2); for Path 1 (no
    // Bilty) both default from the Loading Challan's single Party field (owner's Round 20 decision — Party
    // field itself isn't split into two, but both roles start pre-filled from it), still editable here —
    // now as proper Party-linked fields (Round 21; searches the full Party list, no Type filter, since Round 23n).
    consignorId: linkedBilty ? (linkedBilty.consignorId||'') : (ch.partyId||''),
    consigneeId: linkedBilty ? (linkedBilty.consigneeId||'') : (ch.partyId||''),
    consignorName: linkedBilty ? (findName(parties, linkedBilty.consignorId)||'') : (ch.partyName||''),
    consigneeName: linkedBilty ? (findName(parties, linkedBilty.consigneeId)||'') : (ch.partyName||''),
    balancePayableAt:'', commStatus:'Pending', remark:'', financialYear: computeFY(), signatureCollected:false,
    paymentType: paymentType||'To-Be-Billed', freightPaidByRole: freightPaidByRole||'', freightPaidByOtherLabel: freightPaidByOtherLabel||'',
    podReceived: existingPod ? existingPod.status==='Received' : false, podDocs: existingPod ? (existingPod.photos||[]) : [],
    podNote: existingPod ? (existingPod.note||'') : '',
    podDamage: existingPod ? (existingPod.damage||'No') : 'No',
    podDamageNotes: existingPod && existingPod.damage==='Yes' ? (existingPod.damageNotes||'') : '',
    // Round 23r: same retroactive-carry-forward treatment as Unload Weight/Note/Damage above — if POD was
    // already marked (with the To-Pay Freight Collection question answered) before this Freight Challan even
    // existed, that confirmed collection status/amount carries straight in rather than being lost.
    toPayFreightReceived: existingPod ? (existingPod.toPayFreightReceived||'') : '',
    toPayAmountReceived: existingPod ? (existingPod.toPayAmountReceived||'') : '',
    // Round 23t: only meaningful for Path 1 (no linked Bilty) — Path 2 reads the same concept straight off
    // the Bilty's own billAtBookingRate/biltyRate instead (see computeFreightChallanCalc). Defaults to "Yes"
    // (no change from the Booking Rate) either way.
    billAtBookingRate:'Yes', billRate:'', billRateType: ch.bookingRateType||'PerMT',
    payments:[], recoveries:[]
  };
  freightChallans.push(rec);
  ch.linkedFreightChallanId = rec.id;
  // Retroactively link the pre-existing POD record to this just-created Freight Challan so future POD
  // updates (Mark as NOT Received, etc.) sync onto it too via syncPodToLinkedDocs().
  if(existingPod) existingPod.freightChallanId = rec.id;
  // Land directly on the editable Settlement Details screen rather than the (still-empty) read-only Detail
  // view — per owner feedback, there's nothing useful to look at on Detail until Shortage/Charges/Advances
  // have actually been entered, so the data-entry screen should open immediately after creation. Set screen
  // directly (not via go()) so "back" returns to the Loading Challan/Bilty Detail the same as before, rather
  // than to the now-stale "Start Freight Challan" screen.
  draft = rec;
  addingCharge = false;
  addingAdvance = false;
  closeMore();
  screen = 'freightChallanForm';
  render();
}
function openFreightChallanStart(challanId){
  const ch = loadingChallans.find(c=>c.id==challanId);
  if(!ch) return;
  if(ch.linkedFreightChallanId){
    openFreightChallanDetail(ch.linkedFreightChallanId);
    screen = 'freightChallanDetail';
    render();
    return;
  }
  // Kept deliberately minimal — Payment Type and Who Pays the Freight only, exactly as in Round 17 — per
  // owner's Round 19 follow-up feedback: everything else (Supplier, Broker, Consignor/Consignee, Weight/
  // Shortage, Charges, TDS, Diesel, Advances, Additional Details) belongs on the single next screen (Edit
  // Settlement Details) so data entry isn't spread across more windows than necessary.
  draft = {loadingChallanId: challanId, paymentType:'', freightPaidByRole:'', freightPaidByOtherLabel:''};
  go('freightChallanStart');
}
function renderFreightChallanStart(){

    <div class="section-title" style="margin-top:0;">Payment Type <span class="req">*</span></div>
    <select id="fs_paytype" onchange="draft.paymentType=this.value;renderFreightChallanStart();">

    </select>

      ? 'Party pays the driver directly at delivery — we will need to recover our commission/margin from the driver.'
      : draft.paymentType ? 'We pay the driver ourselves — whatever is owed back to us from the party is tracked separately, not here.' : ''}</div>

    <div class="section-title">Who Pays the Freight? <span class="req">*</span></div>
    <select id="fs_role" onchange="draft.freightPaidByRole=this.value;renderFreightChallanStart();">
      <option value="" ${!draft.freightPaidByRole?'selected':''} disabled>Select...</option>
      ${FREIGHT_PAYER_ROLES.map(t=>`<option ${draft.freightPaidByRole===t?'selected':''}>${t}</option>`).join('')}
    </select>
    ${draft.freightPaidByRole==='Other' ? `<input type="text" placeholder="Specify who pays" value="${esc(draft.freightPaidByOtherLabel||'')}" onchange="draft.freightPaidByOtherLabel=this.value">` : ''}
    <div class="field-hint">Just the role — not a specific party name, since this Loading Challan's own Party field already covers that.</div>

function saveFreightChallanStart(){
  if(!draft.paymentType || !draft.freightPaidByRole){ toast('Payment Type and Who Pays the Freight are both required'); return; }
  createFreightChallanFromChallan(draft.loadingChallanId, null, {
    paymentType: draft.paymentType,
    freightPaidByRole: draft.freightPaidByRole,
    freightPaidByOtherLabel: draft.freightPaidByRole==='Other' ? (draft.freightPaidByOtherLabel||'') : ''
  });
}
// Round 23o: Commission Status is conditional — hidden/replaced by this label when a Commission charge already
// nets it out via the Charges list; otherwise reflects the Yes/No (+ mode/date when Yes) prompt on the form.
function commissionStatusLabel(f){
  const hasCommCharge = (f.charges||[]).some(c=>c.type==='Commission');
  if(hasCommCharge) return 'Already netted via Commission charge';
  if(f.commissionPaid==='Yes') return `Paid${f.commissionPaidMode?' · '+esc(f.commissionPaidMode):''}${f.commissionPaidDate?' · '+esc(f.commissionPaidDate):''}`;
  if(f.commissionPaid==='No') return 'Not Paid';
  return 'Not asked yet';
}
function computeFreightChallanCalc(f){
  const weight = Number(f.loadWeight)||0;
  const hasUnload = f.unloadWeight !== '' && f.unloadWeight != null;
  const unload = hasUnload ? Number(f.unloadWeight) : weight;
  const shortage = Math.max(0, weight - unload);
  const tolerance = Number(f.shortageTolerance)||0;
  const cuttingRate = Number(f.cuttingRate)||0;
  const hireRate = Number(f.hireRate)||0;
  const bookingRate = Number(f.bookingRate)||0;
  const hireFixed = f.hireRateType==='Fixed';
  const bookingFixed = f.bookingRateType==='Fixed';
  const truckFreight = hireFixed ? hireRate : weight*hireRate;
  const shortageAmount = hireFixed ? 0 : (shortage*hireRate) + Math.max(0, shortage-tolerance)*cuttingRate;
  const charges = f.charges||[];
  // Each charge has a direction from the Charge Type Master (Commission/Halting locked, others tweakable
  // per-instance): 'Recoverable' is deducted from what we owe the truck/driver (like Commission always was),
  // 'Payable' is added to it (like Halting always was) — this replaces the old 6 fixed named fields with a
  // scalable list so future charge examples can be handled without changing the calculation logic.
  const chargeRows = charges.map(c=>({...c, amt: Number(c.amount)||0}));
  const commission = chargeRows.filter(c=>c.type==='Commission').reduce((s,c)=>s+c.amt,0);
  const halting = chargeRows.filter(c=>c.type==='Halting Charges').reduce((s,c)=>s+c.amt,0);
  const adjustments = chargeRows.reduce((s,c)=>s + (c.direction==='Recoverable' ? -c.amt : c.amt), 0);
  // TDS is a standalone deduction (re-added per owner instruction), not a Charge Type entry — always treated
  // like a Recoverable charge against the truck/driver. Diesel given to the driver is tracked separately from
  // the generic Advances list (its own Amount + Pump Name), but affects the books the same way an advance does.
  // TDS can be a flat ₹ Amount, or (added Round 23d) a Percentage of Truck Freight — computed live here so it
  // always tracks the current Truck Freight if Hire Rate/Weight are corrected later, rather than being frozen
  // at whatever it was when the % was first entered.
  const tdsAmount = f.tdsMode==='Percentage' ? Math.round(truckFreight * (Number(f.tdsPct)||0) / 100) : (Number(f.tdsAmount)||0);
  const dieselAmt = Number(f.dieselAmount)||0;
  const advanceRows = (f.advances||[]).map(a=>({...a, amt: Number(a.amount)||0}));
  const advancesTotal = advanceRows.reduce((s,a)=>s+a.amt,0) + dieselAmt;
  const isConsignee = f.freightPaidByRole==='Consignee';
  const skipShortageForConsignee = isConsignee && shortage>0;

  // Round 23t: the party/broker sometimes agrees to a rate different from the Loading Challan's own Booking
  // Rate carried onto this Freight Challan — handled upstream on the linked Bilty (Module E's
  // billAtBookingRate/biltyRate) when one exists (Path 2), or directly here via this Freight Challan's own
  // Edit Settlement Details fields (billAtBookingRate/billRate, Path 1 only — no Bilty to carry it from,
  // mirroring how Consignor/Consignee are already Path-1-only fields on this same screen) when there isn't.
  // This only ever changes what the party is expected to pay/recover below — Truck Freight above (the
  // driver's own side, Hire-Rate-based) is never affected by it.
  const linkedBilty = f.biltyId ? bilties.find(b=>b.id==f.biltyId) : null;
  const billSource = linkedBilty || f;
  const billOverrideActive = billSource.billAtBookingRate==='No' && Number(linkedBilty ? linkedBilty.biltyRate : f.billRate)>0;
  const effectiveBookingRate = billOverrideActive ? (Number(linkedBilty ? linkedBilty.biltyRate : f.billRate)||0) : bookingRate;
  const effectiveBookingFixed = billOverrideActive ? ((linkedBilty ? linkedBilty.biltyRateType : f.billRateType)==='Fixed') : bookingFixed;

  if(f.paymentType==='To-Pay'){
    const bookingFreightExpected = effectiveBookingFixed ? effectiveBookingRate
      : isConsignee ? (weight*effectiveBookingRate) + (halting>0?halting:0)
      : Math.min(weight,unload)*effectiveBookingRate;
    // Round 23r: before POD, we only have this theoretical estimate of what the party owes the driver
    // directly. Once POD confirms (Yes/No, with an amount if No/partial) what the driver actually collected,
    // that CONFIRMED figure drives the real recovery math below instead of the estimate — the estimate is
    // still returned separately (bookingFreightExpected) so the Detail view can show both side by side.
    const toPayConfirmed = f.toPayFreightReceived === 'Yes' || f.toPayFreightReceived === 'No';
    const bookingFreight = toPayConfirmed ? (Number(f.toPayAmountReceived)||0) : bookingFreightExpected;
    const toPayBalanceDue = toPayConfirmed ? Math.max(0, bookingFreightExpected - bookingFreight) : 0;
    const truckGross = truckFreight + adjustments - (skipShortageForConsignee?0:shortageAmount) - tdsAmount;
    const netPayableToDriver = truckGross - bookingFreight;
    const truckFreightFinal = (truckFreight + adjustments - shortageAmount - tdsAmount) - advancesTotal;
    const amountToRecover = netPayableToDriver < 0 ? -netPayableToDriver : 0;
    const extraPayable = netPayableToDriver > 0 ? netPayableToDriver : 0;
    const recoveriesTotal = (f.recoveries||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);
    const recoverableBalance = Math.max(0, amountToRecover - recoveriesTotal);
    // Round 23s (bug fix): when the party hasn't paid the driver in full (confirmed via the Round 23r POD
    // question), netPayableToDriver can flip positive — the business now owes the driver the shortfall
    // directly, instead of recovering anything. Before this fix, `isSettled` only ever looked at
    // amountToRecover/recoverableBalance, which are always 0 whenever extraPayable>0 — so this case showed
    // "Fully Settled" immediately, with no way to log the payments actually made to close it out. This now
    // tracks its own running total/balance, fed by the `f.payments` ledger (the business PAYING the driver —
    // see renderFreightChallanDetail's ledgerDirection — never `f.recoveries`, which is specifically money
    // coming FROM the driver).
    const extraPayablePaidTotal = (f.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
    const extraPayableBalance = Math.max(0, extraPayable - extraPayablePaidTotal);
    const isSettled = extraPayable>0 ? extraPayableBalance<=0 : (amountToRecover<=0 || recoverableBalance<=0);
    return {mode:'recover', weight, unload, shortage, shortageAmount, skipShortageForConsignee,
      truckFreight, bookingFreight, bookingFreightExpected, toPayConfirmed, toPayBalanceDue, chargeRows, commission, tdsAmount, dieselAmt, advanceRows, advancesTotal,
      truckGross, netPayableToDriver, truckFreightFinal, amountToRecover, extraPayable, recoveriesTotal, recoverableBalance,
      extraPayablePaidTotal, extraPayableBalance, isSettled,
      billOverrideActive, effectiveBookingRate, effectiveBookingFixed};
  } else {
    // Paid or To-Be-Billed: we pay the truck ourselves; the party-side hisab is a separate module (out of scope here)
    const netPayableToTruck = truckFreight + adjustments - shortageAmount - tdsAmount;
    // Round 23m: Advances — whether added directly on this Freight Challan or synced in automatically from the
    // Bilty's own Advance section via syncBiltyAdvancesToFreightChallan() — are now subtracted from the Gross
    // figure above to reach what's actually still payable to the truck. Previously this branch (unlike the
    // To-Pay branch, where Advances only affect a separate reference figure by explicit owner decision) ignored
    // Advances entirely, so a driver who'd already been given cash/UPI against the trip still showed the full
    // freight as payable here — risking a double payment and, per the owner's own words, avoidable errors.
    const finalPayableToTruck = netPayableToTruck - advancesTotal;
    const paymentsTotal = (f.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
    const balance = Math.max(0, finalPayableToTruck - paymentsTotal);
    const isSettled = balance<=0;
    return {mode:'pay', weight, unload, shortage, shortageAmount,
      truckFreight, chargeRows, commission, tdsAmount, dieselAmt, advanceRows, advancesTotal,
      netPayableToTruck, finalPayableToTruck, paymentsTotal, balance, isSettled};
  }
}

/* ---------------- Freight Challan settlement WhatsApp share (Round 23d, same real-target pattern as Loading Challan Round 23c) ---------------- */
// Sent to whoever the truck-side account actually concerns — the Truck Owner if a mobile is on file,
// otherwise the Driver — rather than the Party (Consignor/Consignee), since this is the truck's own
// settlement, not the booking sent to the party (that's what the Loading Challan's own share is for).
let freightShareCtx = null;
// Round 23v: shared helper so the WhatsApp message's structure/wording is computed in exactly one place and
// stays identical between the modal preview (openFreightShareModal) and the actual send (confirmFreightShare)
// — both used to recompute labels/amounts independently, which is how they could drift apart. This also
// implements the owner's ask that the message read like the actual Truck Account card: what was cut from the
// freight, what was added, the resulting gross, then each amount received with its date, then the balance
// still pending — instead of a flat list of unrelated fields.
function freightStatementCtx(f){
  const calc = computeFreightChallanCalc(f);
  const isExtraPayableSettlement = calc.mode==='recover' && calc.extraPayable>0;
  const ledgerDirection = calc.mode==='recover' ? (isExtraPayableSettlement ? 'pay' : 'recover') : 'pay';
  const grossLabel = calc.mode==='recover' ? 'Truck Gross (after Charges/Shortage/TDS)' : 'Net Payable to Truck (after Charges/Shortage/TDS)';
  const grossAmt = calc.mode==='recover' ? calc.truckGross : calc.netPayableToTruck;
  const netLabel = calc.mode==='recover'
    ? (calc.extraPayable>0 ? 'Extra Payable to Driver' : 'Net to Recover from Driver')
    : 'Final Payable to Truck';
  const netAmt = calc.mode==='recover' ? (calc.extraPayable>0?calc.extraPayable:calc.amountToRecover) : Math.max(0,calc.finalPayableToTruck);
  const balanceLabel = ledgerDirection==='recover' ? 'Balance to Recover' : (isExtraPayableSettlement ? 'Balance Still Payable to Driver' : 'Balance Payable');
  const balanceAmt = ledgerDirection==='recover' ? calc.recoverableBalance : (isExtraPayableSettlement ? calc.extraPayableBalance : calc.balance);
  const charges = f.charges||[];
  const advances = f.advances||[];

function markFreightFullySettled(id){
  // Round 23f: the owner asked that "Mark as Fully Settled" no longer silently push a hardcoded Cash entry —
  // instead it should ask who is paying/receiving this closing balance, on what date, and by what mode, exactly
  // like a normal ledger entry. This just opens that confirmation mini-form; the actual settling now happens in
  // confirmMarkFreightFullySettled() once the owner fills it in.
  const f = freightChallans.find(x=>x.id===id);
  if(!f) return;
  const calc = computeFreightChallanCalc(f);
  // Round 23s: when this To-Pay Freight Challan's Extra-Payable case is the one open (party under/never-paid
  // the driver, so the business owes the driver instead of recovering from them), the real remaining amount
  // is calc.extraPayableBalance, not calc.recoverableBalance (which is always 0 in that case and would close
  // this out at ₹0 instantly, hiding the real balance from the user).
  const isExtraPayableSettlement = calc.mode==='recover' && calc.extraPayable>0;
  const ledgerDirection = calc.mode==='recover' ? (isExtraPayableSettlement ? 'pay' : 'recover') : 'pay';
  const remaining = ledgerDirection==='recover' ? calc.recoverableBalance : (isExtraPayableSettlement ? calc.extraPayableBalance : calc.balance);
  markingSettled = id;
  settleFormDraft = {amount:String(remaining), paidParty: ledgerDirection==='recover' ? 'Driver' : 'Owner', paidPartyOther:'', date:new Date().toISOString().slice(0,10), mode:'Cash', refNo:'', note:'', source: ADVANCE_SOURCES[0], sourceOtherLabel:''};
  renderFreightChallanDetail();
}

        <div class="field-hint" id="podBalanceHint">Whatever is entered here is what's used in the Freight Challan's own recovery calculation — enter 0 if nothing's been paid yet. Balance still due from ${esc(payerLabel)}: ₹${Math.max(0,expectedAmt-(Number(draft.toPayAmountReceived)||0)).toLocaleString('en-IN')}.</div>
      ` : ''}

function podRefreshBalanceHint(expectedAmt){
  const hint = document.getElementById('podBalanceHint');
  if(!hint) return;
  const received = Number(draft.toPayAmountReceived)||0;
  const payerLabel = podFreightPayerLabel(draft.biltyId ? bilties.find(x=>x.id===draft.biltyId) : null, draft.freightChallanId ? freightChallans.find(x=>x.id===draft.freightChallanId) : null);
  hint.textContent = `Enter 0 if nothing's been paid yet, or the partial amount already given — this is saved on the Freight Challan for accountability. Balance still due from ${payerLabel}: ₹${Math.max(0,expectedAmt-received).toLocaleString('en-IN')}.`;
}
function savePod(){
  if(!draft.photos.length){ toast('Add at least one POD photo'); return; }
  if(!draft.podDate){ toast('POD Date is required'); return; }
  const b = draft.biltyId ? bilties.find(x=>x.id===draft.biltyId) : null;
  const f = draft.freightChallanId ? freightChallans.find(x=>x.id===draft.freightChallanId) : null;
  // Round 23r: for a To-Pay trip, this question is required before POD can be confirmed — same gating the
  // owner asked for ("pehle wo hamse ask kar le"), so the Freight Challan's recovery math is never left
  // silently assuming a full, unconfirmed collection.
  if(podIsToPay(b, f) && !draft.toPayFreightReceived){ toast('Please confirm whether the driver has received the To-Pay freight'); return; }
  const isNew = !draft.id;
  const rec = isNew ? {id: nextId.pod++} : podRecords.find(x=>x.id===draft.id);
  Object.assign(rec, {
    biltyId: draft.biltyId||'', freightChallanId: draft.freightChallanId||'',
    photos: draft.photos, receivedWeight: draft.receivedWeight||'',
    damage: draft.damage||'No', damageNotes: draft.damage==='Yes' ? (draft.damageNotes||'') : '',
    note: draft.note||'', podDate: draft.podDate,
    toPayFreightReceived: draft.toPayFreightReceived||'',
    // Round 23x: whatever amount is actually entered in the Amount Received field is what's saved and fed
    // into the Freight Challan's own recovery calculation — for EITHER Yes or No, not just No. Previously
    // "Yes" silently re-saved the theoretical expected figure regardless of what (if anything) was typed into
    // the amount field, since that field used to only exist for "No".
    toPayAmountReceived: (draft.toPayFreightReceived==='Yes' || draft.toPayFreightReceived==='No') ? (draft.toPayAmountReceived||'0') : '',
    receivedAt: new Date().toLocaleString('en-IN'), status:'Received'
  });
  if(isNew) podRecords.push(rec);
  syncPodToLinkedDocs(rec);
  toast('POD marked received');
  openPodDetail(rec.id);
  screen = 'podDetail';
  render();
}
// Keeps the Bilty's Trip Completed flag and the Freight Challan's podReceived flag/photos in step with the
// POD record's current status, and — only when the field is still blank — carries the Received Weight into
// the Freight Challan's Unload Weight for the final settlement calculation (item 7's own explicit ask).
function syncPodToLinkedDocs(rec){
  const received = rec.status==='Received';
  if(rec.biltyId){
    const b = bilties.find(x=>x.id===rec.biltyId);
    if(b) b.tripCompleted = received;
  }
  if(rec.freightChallanId){
    const f = freightChallans.find(x=>x.id===rec.freightChallanId);
    if(f){
      f.podReceived = received;
      f.podDocs = rec.photos;
      if(received && !f.unloadWeight && rec.receivedWeight) f.unloadWeight = rec.receivedWeight;
      f.podNote = rec.note || '';
      f.podDamage = rec.damage || 'No';
      f.podDamageNotes = rec.damage==='Yes' ? (rec.damageNotes||'') : '';
      // Round 23r: whether/how much of the To-Pay freight the driver actually collected, confirmed at POD
      // time — computeFreightChallanCalc() uses this (once set) instead of its own pre-POD estimate, so the
      // Truck Account's recovery figures on this Freight Challan reflect what was actually collected.
      if(rec.toPayFreightReceived){
        f.toPayFreightReceived = rec.toPayFreightReceived;
        f.toPayAmountReceived = rec.toPayAmountReceived;
      }
    }
  }
}

function saveFreightSettlement(){
  const f = freightChallans.find(x=>x.id===draft.id);
  if(!f) return;
  f.supplierId = draft.supplierId||'';
  // Round 23p: Title Case is only applied to a free-typed name that never resolved to a picked/linked Party
  // record (that record's own name was already normalized at Party save time) — running it through again is
  // harmless either way (toTitleCase is idempotent on already-correct casing), but this keeps a "Self (...)"
  // label or any other already-formatted value from being touched unnecessarily.
  f.supplierName = toTitleCase((draft.supplierName||'').trim());
  f.brokerId = draft.brokerId||'';
  f.brokerName = toTitleCase((draft.brokerName||'').trim());
  if(!f.biltyId){
    f.consignorId = draft.consignorId||'';
    f.consigneeId = draft.consigneeId||'';
    f.consignorName = toTitleCase(draft.consignorName||'');
    f.consigneeName = toTitleCase(draft.consigneeName||'');
  }
  f.hireRate = draft.hireRate||f.hireRate;
  f.hireRateType = draft.hireRateType||f.hireRateType||'PerMT';
  f.loadWeight = draft.loadWeight||f.loadWeight;
  f.unloadWeight = draft.unloadWeight||'';
  f.shortageTolerance = draft.shortageTolerance||'0';
  f.cuttingRate = draft.cuttingRate||'0';
  f.charges = draft.charges||[];
  f.tdsMode = draft.tdsMode||'Fixed';
  f.tdsAmount = draft.tdsAmount||'0';
  f.tdsPct = draft.tdsPct||'0';
  f.dieselAmount = draft.dieselAmount||'0';
  f.dieselPump = draft.dieselPump||'';
  f.advances = draft.advances||[];
  f.paymentType = draft.paymentType||'To-Be-Billed';
  if(!f.biltyId){
    f.freightPaidByRole = draft.freightPaidByRole||'';
    f.freightPaidByOtherLabel = draft.freightPaidByRole==='Other' ? (draft.freightPaidByOtherLabel||'') : '';
  }
  f.balancePayableAt = draft.balancePayableAt||'';
  // Round 23o: Commission Status redesign — hidden entirely (and left untouched) when a Commission charge
  // already exists in f.charges; otherwise Yes/No plus (only when Yes) mode+date. The old fixed
  // Pending/Paid `commStatus` field is no longer written by this form.
  const hasCommCharge = (f.charges||[]).some(c=>c.type==='Commission');
  if(!hasCommCharge){
    f.commissionPaid = draft.commissionPaid||'';
    f.commissionPaidMode = f.commissionPaid==='Yes' ? (draft.commissionPaidMode||'') : '';
    f.commissionPaidDate = f.commissionPaid==='Yes' ? (draft.commissionPaidDate||'') : '';
  }
  f.remark = draft.remark||'';
  // Round 23o: Financial Year is no longer shown or editable in this UI (owner said it's not needed) — still
  // computed and stored silently in case anything downstream reads it, but never surfaced.
  f.financialYear = f.financialYear||computeFY(f.date);
  f.signatureCollected = !!draft.signatureCollected;
  toast('Settlement details saved');
  openFreightChallanDetail(f.id);
  screen = 'freightChallanDetail';
  render();
}

/* ================= PAYMENT MANAGEMENT (added Round 17) =================
   A lightweight, practical ledger for money movements that aren't already tracked inside a Freight
   Challan's own Payment/Recovery entries — e.g. settling an old party balance, an office expense, a
   driver advance outside a specific trip, or any other cash/bank movement. Two directions: Payment Out
   (money leaving the business) and Receipt In (money coming in). Each entry can optionally be linked to
   a Party and carries a Reference/Transaction No., same as the Freight Challan ledger entries. */
function renderPaymentList(){
  syncChrome('Payment Management', paymentEntries.length+' entries', true);
  const fab = document.getElementById('fab');
  fab.style.display='flex'; fab.textContent='+'; fab.onclick=()=>openPaymentForm();
  setMoreMenu([]);
  const totalOut = paymentEntries.filter(p=>p.direction==='Payment Out').reduce((s,p)=>s+(Number(p.amount)||0),0);
  const totalIn = paymentEntries.filter(p=>p.direction==='Receipt In').reduce((s,p)=>s+(Number(p.amount)||0),0);
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="li-row"><div class="li-sub">Total Payment Out</div><div class="li-sub" style="font-weight:700;color:var(--text);">₹${totalOut.toLocaleString('en-IN')}</div></div>
      <div class="li-row"><div class="li-sub">Total Receipt In</div><div class="li-sub" style="font-weight:700;color:var(--text);">₹${totalIn.toLocaleString('en-IN')}</div></div>
    </div>
    ${paymentEntries.length? paymentEntries.slice().reverse().map(p=>`
      <div class="list-item" onclick="openPaymentForm(${p.id})">
        <div class="li-main">
          <div class="li-title">${p.direction==='Payment Out'?'− ':'+ '}₹${(Number(p.amount)||0).toLocaleString('en-IN')} · ${esc(p.category)}</div>
          <div class="li-sub">${p.partyName||'—'} · ${p.mode}${p.refNo?' · Ref: '+esc(p.refNo):''}</div>
          <div class="li-sub">${p.date||''}</div>
        </div>
        <span class="badge ${p.direction==='Payment Out'?'badge-inactive':'badge-active'}">${p.direction}</span>
      </div>`).join('') : `<div class="empty"><div class="big">💰</div>No payment entries yet</div>`}
  `;
}
function openPaymentForm(id){
  draft = id ? {...paymentEntries.find(p=>p.id==id)} : {direction:'Payment Out', partyId:'', partyName:'', category:'Other', amount:'', mode:'Cash', refNo:'', note:'', date:new Date().toISOString().slice(0,10)};
  go('paymentForm');
}
function renderPaymentForm(){

      <div class="toggle-opt ${draft.direction==='Receipt In'?'sel':''}" onclick="draft.direction='Receipt In';renderPaymentForm();">Receipt In</div>

    </div>
    <label class="field-label">Category</label>

function savePayment(){
  const amount = document.getElementById('f_payamount').value;
  if(!amount || Number(amount)<=0){ toast('Enter a valid amount'); return; }
  const partyName = document.getElementById('ac_paymentparty_input').value.trim();
  const rec = {
    id: draft.id||nextId.payment++,
    direction: draft.direction||'Payment Out',
    partyId: draft.partyId||'', partyName,
    category: document.getElementById('f_paycategory').value,
    amount, mode: document.getElementById('f_paymode').value,
    refNo: document.getElementById('f_payrefno').value,
    date: document.getElementById('f_paydate').value || new Date().toISOString().slice(0,10),
    note: document.getElementById('f_paynote').value
  };
  if(draft.id){ paymentEntries = paymentEntries.map(p=>p.id===rec.id?rec:p); } else { paymentEntries.push(rec); }
  toast('Payment entry saved'); goBack(); renderPaymentList();
}
function deletePayment(id){
  paymentEntries = paymentEntries.filter(p=>p.id!==id);
  toast('Payment entry deleted');
  goBack(); renderPaymentList();
}

  document.getElementById('fab').style.display='none'; setMoreMenu([]);
  let total = 0;
  const rows = freightChallans.map(f=>{

  document.getElementById('content').innerHTML = `

  document.getElementById('fab').style.display='none'; setMoreMenu([]);
  const rows = freightChallans.map(f=>({f, calc:computeFreightChallanCalc(f)})).filter(r=>r.calc.mode==='recover' && !r.calc.isSettled);
  const total = rows.reduce((s,r)=>s+r.calc.recoverableBalance,0);
  document.getElementById('content').innerHTML = `
    <div class="card"><div class="li-sub">Total Pending Recovery</div><div class="li-title">₹${total.toLocaleString('en-IN')}</div></div>
    ${rows.length ? rows.map(r=>{
      return `<div class="list-item" onclick="openFreightChallanDetail(${r.f.id});go('freightChallanDetail')">
        <div class="li-main"><div class="li-title">${r.f.serialNo}</div><div class="li-sub">${esc(freightTruckLabel(r.f))}</div></div>
        <div class="li-sub" style="font-weight:700;color:var(--text);">₹${r.calc.recoverableBalance.toLocaleString('en-IN')}</div>
      </div>`;
    }).join('') : `<div class="empty"><div class="big">✅</div>Nothing pending</div>`}
  `;
}
function renderPendingPayablesReport(){
  syncChrome('Pending Payables', 'Paid / To-Be-Billed Freight Challans', true);
  document.getElementById('fab').style.display='none'; setMoreMenu([]);
  const rows = freightChallans.map(f=>({f, calc:computeFreightChallanCalc(f)})).filter(r=>r.calc.mode==='pay' && !r.calc.isSettled);
  const total = rows.reduce((s,r)=>s+r.calc.balance,0);
  document.getElementById('content').innerHTML = `
    <div class="card"><div class="li-sub">Total Pending Payable</div><div class="li-title">₹${total.toLocaleString('en-IN')}</div></div>
    ${rows.length ? rows.map(r=>{
      return `<div class="list-item" onclick="openFreightChallanDetail(${r.f.id});go('freightChallanDetail')">
        <div class="li-main"><div class="li-title">${r.f.serialNo}</div><div class="li-sub">${esc(freightTruckLabel(r.f))}</div></div>
        <div class="li-sub" style="font-weight:700;color:var(--text);">₹${r.calc.balance.toLocaleString('en-IN')}</div>
      </div>`;
    }).join('') : `<div class="empty"><div class="big">✅</div>Nothing pending</div>`}
  `;
}
function renderPaymentSummaryReport(){
  syncChrome('Payment Summary', paymentEntries.length+' entries', true);
  document.getElementById('fab').style.display='none'; setMoreMenu([]);
  const totalOut = paymentEntries.filter(p=>p.direction==='Payment Out').reduce((s,p)=>s+(Number(p.amount)||0),0);
  const totalIn = paymentEntries.filter(p=>p.direction==='Receipt In').reduce((s,p)=>s+(Number(p.amount)||0),0);
  const byCategory = {};
  paymentEntries.forEach(p=>{ byCategory[p.category] = (byCategory[p.category]||0) + (Number(p.amount)||0); });
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="li-row"><div class="li-sub">Total Payment Out</div><div class="li-sub" style="font-weight:700;color:var(--text);">₹${totalOut.toLocaleString('en-IN')}</div></div>
      <div class="li-row"><div class="li-sub">Total Receipt In</div><div class="li-sub" style="font-weight:700;color:var(--text);">₹${totalIn.toLocaleString('en-IN')}</div></div>
      <div class="li-row"><div class="li-sub">Net</div><div class="li-sub" style="font-weight:700;color:var(--text);">₹${(totalIn-totalOut).toLocaleString('en-IN')}</div></div>
    </div>
    <div class="section-title">By Category</div>
    ${Object.keys(byCategory).length ? Object.keys(byCategory).map(c=>`
      <div class="li-row" style="padding:8px 4px;"><div class="li-sub">${esc(c)}</div><div class="li-sub" style="font-weight:700;color:var(--text);">₹${byCategory[c].toLocaleString('en-IN')}</div></div>
    `).join('') : `<div class="empty"><div class="big">📊</div>No payment entries yet</div>`}
  `;
}

/* ---------------- Render dispatcher ---------------- */
function render(){
  const map = {
    home:renderHome,
    truckList:renderTruckList, truckForm:renderTruckForm, truckDetail:renderTruckDetail,
    driverList:renderDriverList, driverForm:renderDriverForm, driverDetail:renderDriverDetail,
    partyList:renderPartyList, partyForm:renderPartyForm, partyDetail:renderPartyDetail,
    productList:renderProductList, productForm:renderProductForm,
    locationList:renderLocationList, locationForm:renderLocationForm,
    userList:renderUserList, userForm:renderUserForm,
    biltyList:renderBiltyList, biltyForm:renderBiltyForm, biltyDetail:renderBiltyDetail,
    companyProfile:renderCompanyProfileDetail, companyProfileForm:renderCompanyProfileForm,
    loadingChallanList:renderLoadingChallanList, loadingChallanForm:renderLoadingChallanForm, loadingChallanDetail:renderLoadingChallanDetail,
    cancelChallanForm:renderCancelChallanForm,
    freightChallanList:renderFreightChallanList, freightChallanDetail:renderFreightChallanDetail, freightChallanForm:renderFreightChallanForm,
    freightChallanStart:renderFreightChallanStart,
    podList:renderPodList, podForm:renderPodForm, podDetail:renderPodDetail,
    paymentList:renderPaymentList, paymentForm:renderPaymentForm,
    reportsList:renderReportsList, commissionReport:renderCommissionReport, pendingRecoveriesReport:renderPendingRecoveriesReport,
    pendingPayablesReport:renderPendingPayablesReport, paymentSummaryReport:renderPaymentSummaryReport,
  };
  (map[screen]||renderHome)();
  renderCompanyBar();
}
render();

/* live clock in mock status bar */
function tick(){
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
}
tick(); setInterval(tick, 30000);
</script>
