<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiTrack — Clickable Prototype</title>
<style>
  :root{
    --primary:#4F46E5;
    --primary-dark:#3730A3;
    --primary-light:#EEF0FF;
    --bg:#F4F5F9;
    --card:#FFFFFF;
    --text:#1F2333;
    --text-mute:#6B7280;
    --border:#E5E7EB;
    --green:#16A34A;
    --green-bg:#DCFCE7;
    --amber:#B45309;
    --amber-bg:#FEF3C7;
    --gray:#6B7280;
    --gray-bg:#F1F2F6;
    --red:#DC2626;
    --red-bg:#FEE2E2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#E9EBF5,#DDE0F0);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
  }
  .stage-label{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    font-size:12px; color:#4B4F63; background:rgba(255,255,255,.7); padding:4px 12px; border-radius:20px;
    letter-spacing:.03em;
  }
  .phone{
    width:390px;
    max-width:100%;
    height:820px;
    background:var(--bg);
    border-radius:44px;
    box-shadow:0 30px 60px rgba(30,20,80,.35), 0 0 0 10px #14162A;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    height:26px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; font-size:12px; font-weight:600; color:#fff;
    background:var(--primary);
    flex-shrink:0;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:140px; height:22px; background:#14162A; border-radius:0 0 16px 16px; z-index:20;
  }
  .appbar{
    background:var(--primary);
    color:#fff;
    padding:12px 16px 16px;
    flex-shrink:0;
  }
  .appbar-row{display:flex; align-items:center; gap:10px;}
  .appbar-title{font-size:18px; font-weight:700; flex:1;}
  .appbar-sub{font-size:12px; color:#DCDFFF; margin-top:2px;}
  .icon-btn{
    width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;font-size:16px;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,.3);}
  .content{
    flex:1;
    overflow-y:auto;
    padding:14px 14px 90px;
    -webkit-overflow-scrolling:touch;
  }
  .content::-webkit-scrollbar{width:0;}
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    padding:6px 4px 10px;
    z-index:10;
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none;border:none;cursor:pointer;color:var(--text-mute);padding:6px 2px;border-radius:12px;
    font-size:10.5px; font-weight:600;
  }
  .navbtn.active{color:var(--primary);}
  .navbtn svg{width:20px;height:20px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }
  .section-title{font-size:11px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px;}
  .section-title:first-child{margin-top:2px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .stat-num{font-size:22px;font-weight:800;color:var(--primary-dark);}
  .stat-lbl{font-size:11.5px;color:var(--text-mute);margin-top:2px;}
  .quick-actions{display:flex;flex-direction:column;gap:8px;}
  .qa-btn{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);
  }
  .qa-btn .dot{width:34px;height:34px;border-radius:10px;background:var(--primary-light);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .list-item{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .li-main{flex:1; min-width:0;}
  .li-title{font-size:14px;font-weight:700;color:var(--text);}
  .li-sub{font-size:12px;color:var(--text-mute);margin-top:2px;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .badge-active{background:var(--green-bg);color:var(--green);}
  .badge-inactive{background:var(--gray-bg);color:var(--gray);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-type{background:var(--primary-light);color:var(--primary-dark);}
  .type-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .type-filter-opt{padding:6px 11px;border:1px solid var(--border);border-radius:20px;font-size:11.5px;
    font-weight:700;color:var(--text-mute);cursor:pointer;background:#fff;white-space:nowrap;}
  .type-filter-opt.sel{background:var(--primary);color:#fff;border-color:var(--primary);}
  .searchbar{
    display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:9px 12px;margin-bottom:12px;color:var(--text-mute);font-size:13px;
  }
  .fab{
    position:absolute; right:16px; bottom:80px; width:52px;height:52px;border-radius:16px;
    background:var(--primary); color:#fff; border:none; font-size:26px; box-shadow:0 8px 20px rgba(79,70,229,.45);
    cursor:pointer; z-index:9; display:flex;align-items:center;justify-content:center;
  }
  label.field-label{display:block;font-size:12px;font-weight:700;color:var(--text-mute);margin:12px 0 5px;}
  label.field-label .req{color:var(--red);}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;
    background:#fff;color:var(--text);font-family:inherit;
  }
  textarea{resize:vertical;min-height:56px;}
  .toggle-row{display:flex;gap:8px;margin-top:2px;}
  .toggle-opt{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--border);border-radius:10px;
    font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-mute);background:#fff;}
  .toggle-opt.sel{background:var(--primary);border-color:var(--primary);color:#fff;}
  .upload-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .upload-chip{
    display:flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary-dark);
    border:1px dashed #B9BEFB;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:600;flex:1;
    justify-content:center;cursor:pointer;
  }
  .btn-primary{
    width:100%;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:13px;
    font-size:14px;font-weight:700;margin-top:20px;cursor:pointer;
  }
  .btn-primary:active{background:var(--primary-dark);}
  .btn-secondary{
    width:100%;background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:12px;padding:11px;
    font-size:13.5px;font-weight:700;margin-top:8px;cursor:pointer;
  }
  .btn-row{display:flex;gap:8px;margin-top:20px;}
  .btn-row .btn-primary{margin-top:0;}
  .collapsible{border:1px solid var(--border);border-radius:12px;margin-top:14px;overflow:hidden;}
  .collapsible-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
    background:#FAFAFD;cursor:pointer;font-size:13px;font-weight:700;color:var(--text);}
  .collapsible-body{padding:4px 14px 14px;display:none;}
  .collapsible.open .collapsible-body{display:block;}
  .collapsible.open .chev{transform:rotate(180deg);}
  .chev{transition:transform .15s;color:var(--text-mute);}
  .goods-row{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:10px;position:relative;background:#FAFAFD;}
  .goods-row .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{text-align:center;padding:40px 10px;color:var(--text-mute);font-size:13px;}
  .empty .big{font-size:34px;margin-bottom:8px;}
  .toast{
    position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:#1F2333; color:#fff; padding:10px 18px; border-radius:24px; font-size:12.5px; font-weight:600;
    opacity:0; transition:all .25s ease; z-index:80; white-space:nowrap; box-shadow:0 10px 24px rgba(0,0,0,.25);
    max-width:88%; white-space:normal; text-align:center; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .bilty-doc{border:1.5px dashed #C7CAF5;border-radius:14px;padding:14px;background:#fff;}
  .bilty-doc h3{margin:0 0 2px;font-size:16px;color:var(--primary-dark);}
  .bilty-doc .biltyno{font-size:12px;color:var(--text-mute);margin-bottom:10px;}
  .bilty-parties{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .bilty-party-box{background:var(--primary-light);border-radius:10px;padding:9px 10px;}
  .bilty-party-box .k{font-size:9.5px;font-weight:700;color:var(--primary-dark);text-transform:uppercase;letter-spacing:.04em;}
  .bilty-party-box .v{font-size:12.5px;font-weight:700;margin-top:2px;}
  .bilty-party-box .v2{font-size:11px;color:var(--text-mute);}
  table.goods-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  table.goods-table th{text-align:left;color:var(--text-mute);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;}
  table.goods-table td{padding:7px 4px;border-bottom:1px solid #F0F1F6;}
  .summary-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
  .summary-row.total{font-weight:800;font-size:14.5px;border-top:1px solid var(--border);margin-top:6px;padding-top:9px;color:var(--primary-dark);}
  .back-btn{display:flex;align-items:center;gap:4px;font-size:13px;color:#DCDFFF;cursor:pointer;margin-bottom:2px;}
  .more-menu{position:absolute;top:52px;right:14px;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.2);
    padding:8px;width:225px;z-index:40;display:none;}
  .more-menu.open{display:block;}
  .mm-item{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .mm-item:hover{background:var(--primary-light);}
  .mm-item.disabled{color:var(--text-mute);cursor:default;}
  .mm-item.disabled:hover{background:none;}
  .mm-tag{font-size:9px;background:var(--gray-bg);color:var(--text-mute);padding:2px 7px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .field-hint{font-size:11px;color:var(--text-mute);margin-top:4px;}
  .ac-wrap{position:relative;}
  .ac-suggestions{
    position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);
    border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.14);max-height:170px;overflow-y:auto;z-index:35;display:none;
  }
  .ac-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #F3F4F8;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:hover, .ac-item:active{background:var(--primary-light);}
  .ac-empty{padding:9px 12px;font-size:12px;color:var(--text-mute);}
  .ac-item.ac-add{color:var(--primary);font-weight:700;background:#FAFAFF;}
  .ac-item.ac-add:hover{background:var(--primary-light);}
  .link-btn{color:var(--primary);font-weight:700;font-size:12.5px;text-decoration:none;}
  .share-overlay{position:absolute;inset:0;background:rgba(15,17,30,.45);z-index:70;display:none;align-items:flex-end;}
  .share-overlay.open{display:flex;}
  .share-modal{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 18px 22px;max-height:82%;overflow-y:auto;}
  .share-modal h4{margin:0 0 3px;font-size:15px;}
  .share-modal .sub{font-size:12px;color:var(--text-mute);margin-bottom:10px;}
  .share-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #F0F1F6;font-size:13px;}
  .share-row input{width:auto;accent-color:var(--primary);}
  .photo-chip{position:relative;}
  .photo-chip .rmx{
    position:absolute;top:-6px;right:-6px;background:#fff;color:var(--red);border-radius:50%;
    width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,.25);cursor:pointer;
  }
  .company-row{
    display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;
    border-top:1px solid rgba(255,255,255,.18);cursor:pointer;
  }
  .company-logo{
    width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;
  }
  .company-name{flex:1;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .company-chevron{color:#DCDFFF;font-size:14px;flex-shrink:0;}
  .bilty-letterhead{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:10px;}
  .lh-logo{
    width:44px;height:44px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  }
  .lh-info{flex:1;min-width:0;}
  .lh-company{font-size:17px;font-weight:800;color:var(--primary-dark);line-height:1.2;}
  .lh-sub{font-size:11px;color:var(--text-mute);margin-top:2px;}
  .lh-side{text-align:right;flex-shrink:0;}
  .lh-side .lh-sub{margin-top:3px;}
</style>
</head>
<body>
<div class="stage-label">LogiTrack — Phase 1 Clickable Prototype v2 (mock data, front-end only)</div>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span id="clock">9:41</span><span>●●●&nbsp;&nbsp;LTE&nbsp;&nbsp;100%</span></div>
  <div class="appbar">
    <div class="appbar-row">
      <div id="backBtnWrap"></div>
      <div style="flex:1">
        <div class="appbar-title" id="screenTitle">LogiTrack</div>
        <div class="appbar-sub" id="screenSub">Namaste, Mohit</div>
      </div>
      <button class="icon-btn" id="moreBtn" onclick="toggleMore(event)">⋮</button>
    </div>
    <div class="company-row" id="companyRow" onclick="openCompanyProfile()">
      <div class="company-logo" id="companyLogoBox">🏢</div>
      <div class="company-name" id="companyNameText">Loading…</div>
      <span class="company-chevron">›</span>
    </div>
  </div>
  <div class="more-menu" id="moreMenu"></div>
  <div class="content" id="content"></div>
  <button class="fab" id="fab" style="display:none;"></button>
  <div class="bottomnav">
    <button class="navbtn" data-nav="home" onclick="goTab('home')">🏠<span>Home</span></button>
    <button class="navbtn" data-nav="truckList" onclick="goTab('truckList')">🚛<span>Trucks</span></button>
    <button class="navbtn" data-nav="driverList" onclick="goTab('driverList')">🧑<span>Drivers</span></button>
    <button class="navbtn" data-nav="partyList" onclick="goTab('partyList')">🏢<span>Parties</span></button>
    <button class="navbtn" data-nav="biltyList" onclick="goTab('biltyList')">📄<span>Bilty</span></button>
    <button class="navbtn" data-nav="loadingChallanList" onclick="goTab('loadingChallanList')">🧾<span>Loading Challan</span></button>
    <button class="navbtn" data-nav="freightChallanList" onclick="goTab('freightChallanList')">🧮<span>Freight Challan</span></button>
  </div>
  <div class="toast" id="toast"></div>
  <div class="share-overlay" id="shareOverlay" onclick="if(event.target===this) closeShareModal()">
    <div class="share-modal" id="shareModalBox"></div>
  </div>
</div>

<script>
/* ---------------- Reference lists ---------------- */
// Truck Type list (Round 23e) — replaced with the owner's own list of body/size types actually used in his
// fleet, in the order he gave them: wheel-count classes (6/10/12/.../24 Wheeler) and length classes (32/34/
// 40/45 Feet) sit alongside body-type classes (Trailer, Container, Tanker, etc.), since in practice a truck
// is described by whichever of these is most relevant for it — not a single consistent axis.
const TRUCK_TYPES = [
  'Pickup','Mini Truck','LCV','6 Wheeler','10 Wheeler','12 Wheeler','14 Wheeler','16 Wheeler','18 Wheeler',
  '22 Wheeler','24 Wheeler','32 Feet','34 Feet','40 Feet','45 Feet','Trailer','Container','Tanker','Bulker',
  'Tipper','Reefer','Car Carrier','Flatbed','Other'
]; // simplified list of common Indian commercial truck body types (web-researched)
// Party Type (added Round 21, changed from a required single type to an optional multi-tag Round 23n — see
// the PARTIES section further down for the full reasoning). A Party can now be tagged with as many of these
// as it's actually played — 'Transporter' and 'Other' added Round 23n so every role the owner deals with can
// be tagged, matching FREIGHT_PAYER_ROLES below. Every field across the app that sources Consignor/Consignee/
// Supplier/Broker data (Bilty's Consignor/Consignee, Loading & Freight Challan's Supplier, Freight Challan's
// Broker and Path-1 Consignor/Consignee) now searches the full Party Master with no Type filter — the actual
// role for a given Bilty/Challan is decided by which field the party is picked into, not by this Type.
const PARTY_TYPES = ['Consignor','Consignee','Supplier','Broker','Third Party','Transporter','Other'];
// Who actually settles the freight — used on the Bilty, the Freight Challan Start screen, and the Freight
// Challan Settlement screen (Path 1). Previously "Third Party" opened a free-text/Party-Master name search;
// the owner asked to drop that name prompt entirely and instead offer more specific roles directly, with
// "Other" (plus a short free-text label) covering anything that doesn't fit.
const FREIGHT_PAYER_ROLES = ['Consignor','Consignee','Third Party','Transporter','Broker','Other'];

/* ---------------- In-memory mock data (no localStorage — per artifact rules) ---------------- */
let trucks = [
  {id:1, number:'MP04GA1234', type:'Flatbed', capacity:'9', status:'Active', photos:['Photo 1','Photo 2'],
    ownerName:'Devendra Singh', ownerMobile:'94251XXXXX', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
  {id:2, number:'MP09JT5566', type:'Container', capacity:'16', status:'Active', photos:[],
    ownerName:'', ownerMobile:'', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
  {id:3, number:'MP04XY7788', type:'Trailer', capacity:'25', status:'Inactive', photos:[],
    ownerName:'', ownerMobile:'', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
  // Round 23v: owner's own dummy fleet, added as permanent seed data (not just a one-off test record) so
  // these are always available for fast real-world examples while developing further rounds.
  {id:4, number:'BR28GB8118', type:'22 Wheeler', capacity:'', status:'Active', photos:[],
    ownerName:'Meraj Ansari', ownerMobile:'', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
  {id:5, number:'BR24GD7104', type:'22 Wheeler', capacity:'', status:'Active', photos:[],
    ownerName:'Jainul Ansari', ownerMobile:'', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
  {id:6, number:'BR24GD1506', type:'22 Wheeler', capacity:'', status:'Active', photos:[],
    ownerName:'Mohd Wakeel', ownerMobile:'', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
  {id:7, number:'BR24GD6612', type:'22 Wheeler', capacity:'', status:'Active', photos:[],
    ownerName:'Mohd Wakeel', ownerMobile:'', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
  {id:8, number:'NL01AE6872', type:'22 Wheeler', capacity:'', status:'Active', photos:[],
    ownerName:'Ishtiyaque Ansari', ownerMobile:'', ownerPan:'', ownerAadhar:'', ownerAddress:'', referredBy:''},
];
let drivers = [
  {id:1, name:'Ramesh Yadav', contact:'98261XXXXX', license:'MP0420190012345', status:'Active', photos:['Photo 1','Photo 2'], referredBy:''},
  {id:2, name:'Suresh Patel', contact:'94251XXXXX', license:'MP0920180067890', status:'Active', photos:['Photo 1'], referredBy:''},
  // Round 23v: owner's own dummy driver list — added as permanent seed data, same reasoning as the trucks above.
  {id:3, name:'Sajjad', contact:'', license:'', status:'Active', photos:[], referredBy:''},
  {id:4, name:'Ram Ji', contact:'', license:'', status:'Active', photos:[], referredBy:''},
  {id:5, name:'Jainul Ansari', contact:'', license:'', status:'Active', photos:[], referredBy:''},
  {id:6, name:'Durgesh', contact:'', license:'', status:'Active', photos:[], referredBy:''},
];
// Party Master (redesigned Round 21, `type` changed to a multi-select `types` array Round 23n — see the
// PARTIES section below for the full reasoning). `pan`/`address`/`referredBy` are new since Round 21;
// `address` was previously present on the Add/Edit form but never actually saved anywhere — fixed as part

// Groups a list of records by their date field into date-sections, newest date first (Round 23) — used on
// the Loading Challan / Bilty / Freight Challan Lists so it's immediately clear which trucks moved on which
// date, instead of one long undated feed. Assumes the input list is already in the display order wanted
// within a day (e.g. most-recently-added first) — grouping only reorders the sections themselves by date.
function groupByDate(list, dateKey){
  const groups = {};
  list.forEach(item=>{
    const d = item[dateKey] || 'No Date';
    (groups[d] = groups[d]||[]).push(item);
  });
  return Object.keys(groups).sort((a,b)=> a<b?1:a>b?-1:0).map(date=>({date, items:groups[date]}));
}

// app — a stray scroll while the cursor happens to be over a numeric field can quietly bump a rate or
// quantity. Blurring the field on wheel (rather than preventDefault, which would also block the page

    'Settled':'badge-active','Pending':'badge-amber','Received':'badge-active','Not Received':'badge-amber',
    // Round 23s: Loading Challan pipeline stages beyond the original Booked/Delivered pair — 'Bilty Created'
    // sits between them (the amber used for mid-pipeline states here, same family as Booked/Dispatched), and
    // 'Cancelled' gets its own distinct look (reusing badge-inactive's muted grey, same as Closed, since a
    // cancelled challan is no longer actionable — but see the red inline label used on the Detail/List badge
    // itself wherever extra emphasis is wanted).
    'Bilty Created':'badge-amber','Cancelled':'badge-inactive'

// query, since it's a fixed, always-relevant choice, not a search result), separately from the "+Add new"
// row (which stays query-driven, at the bottom).
function attachAutocomplete(inputId, suggId, list, onSelect, getLabel, addOpt, renderItem, selfOpt){
  const input = document.getElementById(inputId);
  const sugg = document.getElementById(suggId);
  if(!input || !sugg) return;
  // `renderItem` (optional) lets a suggestion row show more than what ends up in the input after picking —
  // e.g. Driver shows Mobile + DL No. in the dropdown so two drivers who share a name can be told apart,
  // while the field itself still just fills in with the plain name (getLabel) once one is selected.
  const displayLabel = renderItem || getLabel;
  function renderSugg(){
    const q = input.value.trim();
    const ql = q.toLowerCase();
    const items = ql ? list.filter(it=>getLabel(it).toLowerCase().includes(ql)) : list;
    // Self only shows on an empty/just-focused field or when the typed text itself could mean "self" — never
    // while actively searching for a real name, so it can't accidentally get picked instead of the actual
    // top search match (found the hard way: it was sitting first in the list even while typing "Om Sai").
    const showSelf = selfOpt && (!ql || 'self'.includes(ql));
    let html = '';
    if(showSelf){
      html += `<div class="ac-item ac-self" data-self="1">${esc(selfOpt.label)}</div>`;
    }
    if(!items.length){
      if(!showSelf) html += `<div class="ac-empty">No match found</div>`;
    } else {
      html += items.slice(0,8).map(it=>`<div class="ac-item" data-id="${it.id}">${displayLabel(it)}</div>`).join('');
    }
    if(addOpt && q){
      html += `<div class="ac-item ac-add" data-add="1">➕ Add "${esc(q)}" as new ${addOpt.kindLabel}</div>`;
    }
    sugg.innerHTML = html;
    sugg.style.display = 'block';
  }
  input.addEventListener('input', renderSugg);
  input.addEventListener('focus', renderSugg);
  input.addEventListener('blur', ()=>setTimeout(()=>{ sugg.style.display='none'; }, 150));
  sugg.addEventListener('mousedown', (e)=>{
    const selfItem = e.target.closest('.ac-self');
    if(selfItem){
      sugg.style.display = 'none';
      selfOpt.onSelect();
      return;
    }
    const addItem = e.target.closest('.ac-add');
    if(addItem){
      const q = input.value.trim();
      sugg.style.display = 'none';
      if(addOpt) addOpt.onAdd(q);
      return;
    }
    const item = e.target.closest('.ac-item');
    if(!item) return;
    const found = list.find(it=>String(it.id)===String(item.dataset.id));
    if(found){ input.value = getLabel(found); onSelect(found); }
    sugg.style.display = 'none';
  });
}

  // other quick-add kind (party/truck) stores the new record's id directly.
  draft[ctx.field] = ctx.kind==='location' ? ((locations.find(l=>l.id===newId)||{}).name||'') : newId;
  // Round 23i (bug fix): quick-adding a brand-new Truck here — filling in its Owner Name/Mobile on the Truck
  // form — used to leave this Loading Challan's own Owner Name/Mobile fields blank, forcing the same detail to
  // be typed a second time. Picking an EXISTING truck from the suggestions has always auto-filled these (Round

  if(ctx.kind==='truck'){

    if(t){
      if(!draft.ownerMobile && t.ownerMobile) draft.ownerMobile = t.ownerMobile;
      if(!draft.ownerName && t.ownerName) draft.ownerName = t.ownerName;

  }
  // Round 23p (bug fix): quick-adding a brand-new Party here — entering its Contact Number on the Party form —
  // used to leave this Loading Challan's own Party Number field blank, exactly the same gap Round 23i already
  // fixed for a quick-added Truck's Owner Mobile. Picking an EXISTING party from the suggestions has always
  // auto-filled Party Number (see attachChallanAutocompletes' Party onSelect); this brings the quick-add path
  // to the same behavior — only fills in a field that's still blank, so it never overwrites a number already

  if(ctx.kind==='party'){

/* ---------------- Loading Challan finalized-booking WhatsApp share (Round 23, deselectable Round 23b, targeted to the Party's own WhatsApp number Round 23c) ---------------- */
// Every field — including the "core" booking fields (Truck No, Loading Date, From/To, Freight, Booking
// Rate, Weight, Party Name, Driver Mobile) — starts pre-checked (owner's original ask was that these are
// sent by default), but any of them can be unchecked before sending, same as the Notes below.
// Cleans a free-typed phone number (spaces/dashes/+/leading 0, or an already-present 91) down to the plain
// 91XXXXXXXXXX form wa.me needs. Returns '' if what's left isn't a plausible 10-digit Indian mobile number,
// so the caller can warn instead of opening a broken WhatsApp link.
// Round 23s: shared clipboard-copy fallback for every "no valid number on file" WhatsApp share case (Loading
// Challan and Freight Challan both use this) — navigator.clipboard.writeText needs a secure context/focused
// document and can reject, so this falls back to the old hidden-textarea + execCommand('copy') trick, and
// silently gives up only if both fail (the toast still tells the user the message text itself, as before).
function copyTextToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(()=>{ copyTextToClipboardFallback(text); });
      return;
    }
  }catch(e){}
  copyTextToClipboardFallback(text);
}
function copyTextToClipboardFallback(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
}
function normalizeIndianMobileForWhatsApp(raw){
  let digits = (raw||'').replace(/\D/g,'');
  if(digits.length===12 && digits.startsWith('91')) digits = digits.slice(2);
  else if(digits.length===11 && digits.startsWith('0')) digits = digits.slice(1);
  if(digits.length!==10) return '';
  return '91'+digits;
}
let challanShareCtx = null;
function openChallanShareModal(id){
  const c = loadingChallans.find(x=>x.id===id);
  if(!c) return;
  challanShareCtx = {id};
  const weight = Number(c.weight)||0, booking = Number(c.bookingRate)||0;
  const bookingIsFixed = c.bookingRateType==='Fixed';
  const freightAmount = bookingIsFixed ? booking : booking*weight;
  const party = parties.find(p=>p.id==c.partyId)||{};
  const rawPartyNumber = c.partyNumber || party.contact || '';
  const targetNumber = normalizeIndianMobileForWhatsApp(rawPartyNumber);
  document.getElementById('shareModalBox').innerHTML = `
    <h4>Share Booking Details via WhatsApp</h4>
    <div class="sub">Choose what to include — everything is pre-selected, untick anything you don't want to send</div>
    ${targetNumber
      ? `<div class="card" style="padding:10px 12px;"><div class="li-sub">Sending to (Party's WhatsApp)</div><div class="li-title" style="font-size:14px;">${esc(party.name || c.partyName || 'Party')} · +${targetNumber}</div></div>`
      : `<div class="field-hint">⚠ No valid Party phone number found (checked this Challan's Party Number, then Party Master's Contact Number) — add one on this Loading Challan or in Party Master to send directly; you can still copy the message below and send it yourself.</div>`}
    <label class="share-row"><input type="checkbox" checked value="truck"> Truck Number: ${esc(challanTruckLabel(c))}</label>
    <label class="share-row"><input type="checkbox" checked value="date"> Loading Date: ${formatDateHuman(c.date)}</label>
    <label class="share-row"><input type="checkbox" checked value="route"> Route: ${esc(c.loadingPoint||'—')} → ${esc(c.unloadingPoint||'—')}</label>
    <label class="share-row"><input type="checkbox" checked value="freight"> Freight: ₹${freightAmount.toLocaleString('en-IN')}</label>
    <label class="share-row"><input type="checkbox" checked value="bookingRate"> Booking Rate: ₹${booking.toLocaleString('en-IN')}${bookingIsFixed?' (Fixed)':'/MT'}</label>
    <label class="share-row"><input type="checkbox" checked value="weight"> Weight: ${weight||'—'} MT</label>
    <label class="share-row"><input type="checkbox" checked value="party"> Party Name: ${esc(party.name || c.partyName || '—')}</label>
    <label class="share-row"><input type="checkbox" checked value="driverMobile"> Driver Mobile Number: ${esc(c.driverMobile||'—')}</label>
    ${(c.notes||[]).length ? (c.notes||[]).map((n,i)=>`<label class="share-row"><input type="checkbox" checked value="note${i}"> Note ${i+1}: ${esc(n)}</label>`).join('') : `<div class="field-hint">No notes added on this Loading Challan.</div>`}
    <button class="btn-primary" onclick="confirmChallanShare()">↗ ${targetNumber ? 'Open WhatsApp Chat with Party' : 'Copy Message (no Party number on file)'}</button>
    <button class="btn-secondary" onclick="closeShareModal()">Cancel</button>
  `;
  document.getElementById('shareOverlay').classList.add('open');
}
function confirmChallanShare(){
  const c = loadingChallans.find(x=>x.id===challanShareCtx.id);
  if(!c){ closeShareModal(); return; }
  const weight = Number(c.weight)||0, booking = Number(c.bookingRate)||0;
  const bookingIsFixed = c.bookingRateType==='Fixed';
  const freightAmount = bookingIsFixed ? booking : booking*weight;
  const party = parties.find(p=>p.id==c.partyId)||{};
  const checked = [...document.querySelectorAll('#shareModalBox input[type=checkbox]:checked')].map(el=>el.value);
  // Round 23p: a Note is now sent in WhatsApp's own bold markup (wrapped in single asterisks) so it stands
  // out to whoever reads the message — the owner asked for this since a Note often flags something the
  // party needs to actually notice (a special instruction, a discrepancy to watch for), not just routine detail.
  const noteLines = (c.notes||[]).map((n,i)=> checked.includes('note'+i) ? `*Note ${i+1}: ${n}*` : null).filter(Boolean);
  const fieldLines = [
    checked.includes('truck') ? `Truck Number: ${challanTruckLabel(c)}` : null,
    checked.includes('date') ? `Loading Date: ${formatDateHuman(c.date)}` : null,
    checked.includes('route') ? `Route: ${c.loadingPoint||'—'} → ${c.unloadingPoint||'—'}` : null,
    checked.includes('freight') ? `Freight: ₹${freightAmount.toLocaleString('en-IN')}` : null,
    checked.includes('bookingRate') ? `Booking Rate: ₹${booking.toLocaleString('en-IN')}${bookingIsFixed?' (Fixed)':'/MT'}` : null,
    checked.includes('weight') ? `Weight: ${weight||'—'} MT` : null,
    checked.includes('party') ? `Party Name: ${party.name || c.partyName || '—'}` : null,
    checked.includes('driverMobile') ? `Driver Mobile: ${c.driverMobile||'—'}` : null,
  ].filter(Boolean);
  const messageLines = [...fieldLines, ...noteLines];
  closeShareModal();
  if(!messageLines.length){ toast('Nothing selected — pick at least one detail to share'); return; }
  // Round 23h: every share now opens with a bold "Loading Slip" title (so whoever reads it on WhatsApp
  // immediately knows what this message is) and closes with the transport company's own name from the
  // Company Profile (so it's clear who sent it) — same wrapping the owner asked for on this specific message.
  const messageParts = ['*Loading Slip*', '', ...messageLines];
  if(companyProfile.companyName) messageParts.push('', companyProfile.companyName);
  const message = messageParts.join('\n');
  const rawPartyNumber = c.partyNumber || party.contact || '';
  const targetNumber = normalizeIndianMobileForWhatsApp(rawPartyNumber);
  if(targetNumber){
    // Opens the Party's own WhatsApp chat (via wa.me) with the message pre-filled — this only composes it;
    // the owner still taps Send inside WhatsApp itself, same as any wa.me/mailto-style share link.
    window.open(`https://wa.me/${targetNumber}?text=${encodeURIComponent(message)}`, '_blank');
    toast('Opening WhatsApp chat with ' + (party.name || c.partyName || 'the Party') + '...');
  } else {
    // Round 23s: copies the full message (with the Loading Slip title/footer) to the clipboard instead of just
    // naming the fields in a toast, so it can be pasted into any chat app, SMS, or email directly.
    copyTextToClipboard(message);
    toast('No valid Party number on file — message copied, paste it wherever you need');
  }
}

/* ================= PARTIES — redesigned Round 21, Type changed to a multi-tag Round 23n =================
   One shared master covering every counterparty role the owner deals with: Consignor, Consignee, Supplier,
   Broker, Third Party, Transporter, Other. **Round 23n reverses the Round 21 decision** that a Party could
   only ever carry one required Primary Type: the owner pointed out that the same real party (his example:
   "Prem") can genuinely be a Consignor on one booking, a Consignee on another, and a Broker or Third Party
   on a third — so forcing one fixed Type per record meant either duplicating the same party under different
   records, or editing its Type back and forth every time it's reused in a different role. **Party Master's
   Type field is now an optional multi-select (checkboxes, `types` array)** — tag a party with as many roles
   as it's actually played, or none yet. More importantly, **every field elsewhere that picks a Consignor /
   Consignee / Supplier / Broker (Bilty, Loading Challan, Freight Challan) now searches the full Party list,
   no longer filtered down to a matching Type** — exactly matching the owner's own framing: "party master
   form me hum bas party add karenge, or jab bilty ya challan banayenge tab hum use uski type tag karenge"
   (in Party Master we'll just add the party, and tag it with its type when we actually make the Bilty or
   Challan). The Type checkboxes on this record are now purely a categorization/filter aid on the Party List
   below, not a gate on which fields a party can be picked from. */
let partyListFilter = 'All'; // Party List's Type filter chip row
function partyTypes(p){ return p && p.types ? p.types : []; }
function renderPartyList(){
  syncChrome('Parties', parties.length+' saved parties', false);
  setMoreMenu([{label:'Export Party List (PDF)', onclick:"toast('Party list exported (prototype)')"}]);
  const fab = document.getElementById('fab');
  fab.style.display='flex'; fab.textContent='+'; fab.onclick=()=>openPartyForm();
  const shown = partyListFilter==='All' ? parties : parties.filter(p=>partyTypes(p).includes(partyListFilter));
  document.getElementById('content').innerHTML = `
    <div class="searchbar">🔍 Search by name or city...</div>
    <div class="type-filter-row">
      ${['All',...PARTY_TYPES].map(t=>`<div class="type-filter-opt ${partyListFilter===t?'sel':''}" onclick="partyListFilter='${t}';renderPartyList();">${t}</div>`).join('')}
    </div>
    ${shown.length? shown.map(p=>`
      <div class="list-item" onclick="openPartyDetail(${p.id});go('partyDetail')">
        <div class="li-main"><div class="li-title">${p.name}</div><div class="li-sub">${p.city||'—'} · ${p.contact||'—'}</div></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <span class="badge badge-type">${partyTypes(p).length ? esc(partyTypes(p).join(', ')) : '—'}</span>
          ${badge(p.status)}
        </div>
      </div>`).join('') : `<div class="empty"><div class="big">🏢</div>No ${partyListFilter==='All'?'parties':partyListFilter.toLowerCase()+' parties'} added yet</div>`}
  `;
}
function openPartyForm(id, prefillName, prefillType){
  draft = id ? {...parties.find(p=>p.id==id), types:[...(parties.find(p=>p.id==id).types||[])]}
    : {name:prefillName||'',types:prefillType?[prefillType]:[],contact:'',city:'',address:'',gstin:'',pan:'',referredBy:'',location:'',acc:'',ifsc:'',accName:'',status:'Active'};

function saveParty(){
  // Round 23o: the Type checkbox UI was removed from this form entirely (party role is now chosen only at the
  // point of use — on a Bilty / Loading Challan / Freight Challan). We still preserve whatever `types` the
  // party already had (or was pre-tagged with via a quick-add's prefillType, e.g. "+Add as new Consignor" from
  // another form) by carrying it over from `draft.types` rather than reading it from a now-nonexistent DOM box.
  const types = draft.types || [];
  const name = toTitleCase(document.getElementById('f_name').value.trim());
  const contact = document.getElementById('f_contact').value.trim();
  if(!name || !contact){ toast('Party Name and Contact Number are required'); return; }
  const rec = {
    id: draft.id||nextId.party++, name, types, contact,
    city: toTitleCase(document.getElementById('f_city').value), address: document.getElementById('f_address').value,

    acc: document.getElementById('f_acc').value, ifsc: document.getElementById('f_ifsc').value,
    accName: document.getElementById('f_accName').value, status: draft.status||'Active'
  };
  if(draft.id){ parties = parties.map(p=>p.id===draft.id?rec:p); } else { parties.push(rec); }
  rememberReferredBy(rec.referredBy);
  if(biltyReturnContext){ returnToBiltyWithNew(rec.id); return; }
  if(challanReturnContext){ returnToChallanWithNew(rec.id); return; }
  if(freightReturnContext){ returnToFreightWithNew(rec.id); return; }
  toast('Party saved'); goBack(); renderPartyList();

// Silently remembers a typed Loading/Unloading Point as a Location Master entry (case-insensitive match on
// name) so it shows up as a suggestion next time — no "Add Location" prompt, per owner feedback that the
// quick-add popup shouldn't appear on the Loading Challan form.
function rememberLocation(name, type){
  const trimmed = (name||'').trim();
  if(!trimmed) return;
  const exists = locations.some(l=>l.name.toLowerCase()===trimmed.toLowerCase());
  if(!exists) locations.push({id:nextId.location++, name:trimmed, city:'', state:'', address:'', type:type||'Both', status:'Active'});
}
// Round 23h: cleans up a pasted Google Maps pin link OR a WhatsApp "Current Location" share (which pastes as a
// short message with a Google Maps link inside it, sometimes with extra text/emoji around it) down to just the
// bare link — so whatever gets saved into Party Master's "Saved Location" is always a clean, directly click-
// able/shareable URL no matter how it was copied. If no URL is found in what was pasted, the text is kept as-is
// (so a manually-typed plain description doesn't just vanish).
function extractMapsLink(raw){
  const text = (raw||'').trim();
  if(!text) return '';
  const match = text.match(/https?:\/\/\S+/i);
  return match ? match[0].replace(/[),.]+$/,'') : text;
}
// Round 23h: same silent "remember, no popup, just suggest next time" pattern as rememberLocation(), for the
// "Referred By" field shared between Party Master and Truck Master.
function rememberReferredBy(name){
  const trimmed = (name||'').trim();
  if(!trimmed) return;
  if(!referredByList.some(v=>v.toLowerCase()===trimmed.toLowerCase())) referredByList.push(trimmed);
}
// Round 23h: a lighter suggestion-only autocomplete for plain free-text fields whose past values are simply
// remembered (not upgraded to their own master record with an id) — e.g. "Referred By". Filters as you type;
// clicking a suggestion just fills the input's text — there's no "Add new" option here since the typed value
// is what gets saved and remembered on its own the next time the form is submitted (via rememberReferredBy()).
function attachTextSuggestions(inputId, suggId, list){
  const input = document.getElementById(inputId);
  const sugg = document.getElementById(suggId);
  if(!input || !sugg) return;
  function renderSugg(){
    const q = input.value.trim().toLowerCase();
    const items = (q ? list.filter(v=>v.toLowerCase().includes(q)) : list).slice(0,8);
    sugg.innerHTML = items.length ? items.map(v=>`<div class="ac-item">${esc(v)}</div>`).join('') : '';
    sugg.style.display = items.length ? 'block' : 'none';
  }
  input.addEventListener('input', renderSugg);
  input.addEventListener('focus', renderSugg);
  input.addEventListener('blur', ()=>setTimeout(()=>{ sugg.style.display='none'; }, 150));
  sugg.addEventListener('mousedown', (e)=>{
    const item = e.target.closest('.ac-item');
    if(!item) return;
    input.value = item.textContent;
    sugg.style.display = 'none';
  });
}
// Suppliers were their own silently-remembered list through Round 20; redesigned Round 21 into Party Master
// (Type = Supplier) — see the PARTY_TYPES comment above and the Party module below. `rememberSupplier` and
// the standalone `suppliers` array are gone; Supplier fields everywhere now search `parties` directly.
// Indian Financial Year (April-March) for a given date, e.g. 13 Aug 2026 -> "2026-27" — used as a default,
// editable Freight Challan field for record-keeping (matches the reference software's FY field).
function computeFY(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1;
  return `${y}-${String((y+1)%100).padStart(2,'0')}`;
}

// Filter state for the Loading Challan List (added Round 22, per owner's request) — Date range, Truck
// Number, and Party Name, all combinable. Kept as simple substring/range matching (no fuzzy search) to
// match every other list in this prototype, which don't have working search/filter yet — this is the first.
let loadingChallanFilterOpen = false;
let loadingChallanFilter = {dateFrom:'', dateTo:'', truck:'', party:''};
function toggleLoadingChallanFilter(){ loadingChallanFilterOpen = !loadingChallanFilterOpen; renderLoadingChallanList(); }
function clearLoadingChallanFilter(){ loadingChallanFilter = {dateFrom:'', dateTo:'', truck:'', party:''}; renderLoadingChallanList(); }
function hasActiveLoadingChallanFilter(){ const f=loadingChallanFilter; return !!(f.dateFrom||f.dateTo||f.truck||f.party); }
function applyLoadingChallanFilter(list){
  const f = loadingChallanFilter;
  return list.filter(c=>{
    if(f.dateFrom && c.date < f.dateFrom) return false;
    if(f.dateTo && c.date > f.dateTo) return false;
    if(f.truck && !challanTruckLabel(c).toLowerCase().includes(f.truck.toLowerCase())) return false;
    if(f.party){
      const party = parties.find(p=>p.id==c.partyId)||{};
      const partyName = (party.name || c.partyName || '').toLowerCase();
      if(!partyName.includes(f.party.toLowerCase())) return false;
    }
    return true;
  });
}

function csupplierHintHtml(){
  const sp = draft.supplierId ? parties.find(p=>p.id==draft.supplierId) : null;
  if(sp) return `<div class="field-hint">${sp.contact?'Mobile: '+esc(sp.contact):''}${sp.contact&&sp.pan?' · ':''}${sp.pan?'PAN: '+esc(sp.pan):''}${(sp.contact||sp.pan)&&sp.address?' · ':''}${sp.address?esc(sp.address):''}</div>`;
  if((draft.supplierName||'').startsWith('Self')) return `<div class="field-hint">Marked as Self — our own truck, no separate Supplier record needed.</div>`;
  return `<div class="field-hint">Doesn't have to match Party Master exactly — pick or quick-add the correct Supplier for the full contact/PAN/address details.</div>`;
}
function attachChallanAutocompletes(){
  // NOTE: these onSelect callbacks deliberately avoid calling renderLoadingChallanForm() (a full
  // #content re-render). Doing a full re-render synchronously from inside attachAutocomplete's
  // `sugg` mousedown handler was found to be unsafe — it replaces the DOM (including the very
  // input/suggestion elements mid-click) while the browser is still completing that same physical
  // click gesture, which could cause the follow-up mouseup/click to misfire on newly-shifted layout
  // and leave fields (like the just-picked Truck) reading as unset by the time Save is tapped. Every
  // onSelect below now does a small, targeted DOM update instead — same pattern as the Party Number
  // auto-fill, which never had this problem.
  attachAutocomplete('ac_ctruck_input','ac_ctruck_sugg', trucks, (item)=>{
      draft.truckId=item.id;
      // Auto-fetch the truck's Owner Name/Mobile from Truck Master (added Round 21) — only fills blank
      // fields, so it never clobbers an owner already typed in for this specific trip.
      if(!draft.ownerMobile && item.ownerMobile){
        draft.ownerMobile = item.ownerMobile;
        const om = document.getElementById('f_ownerMobile');
        if(om) om.value = draft.ownerMobile;
      }
      if(!draft.ownerName && item.ownerName){
        draft.ownerName = item.ownerName;
        const on = document.getElementById('f_ownerName');
        if(on) on.value = draft.ownerName;
      }
    }, t=>truckLabel(t.id),
    {kindLabel:'Truck', onAdd:(q)=>quickAddFromChallan('truck','truckId',q,'Truck')},
    // Round 23n (bug fix): the field itself now fills with just the plain Truck Number after picking/quick-adding
    // one — previously it filled with "Number (Type)" (e.g. "UP80ZZ8888 (Pickup)"), which looked like the Truck
    // Type had gotten mixed into the truck number, and that same polluted text was what actually got saved as
    // this Loading Challan's own truckNumber. The Type still shows in the dropdown list itself, just for reference.
    t=>`${esc(t.number)} <span style="color:var(--text-mute);font-size:11px;">· ${esc(t.type||'—')}</span>`);
  // Truck doesn't have to resolve to a Truck Master record at booking time (owner's explicit decision,
  // same treatment as Party since Round 11) — capture whatever's typed as free text; if it stops matching
  // the previously selected truck, drop the stale link so a mismatched id+number pair never gets saved.
  // The real master-linked truck (and its Owner Details auto-fill) can be picked/quick-added here, or
  // deferred to when this Challan is converted into a Bilty, which does still require a real Truck Master link.
  const cTruckInput = document.getElementById('ac_ctruck_input');
  if(cTruckInput) cTruckInput.addEventListener('input', ()=>{
    draft.truckNumber = cTruckInput.value;
    if(draft.truckId && truckLabel(draft.truckId) !== cTruckInput.value) draft.truckId = '';
  });
  // Location fields are plain free text with suggestions from previously-used locations — no "+ Add as new
  // Location" quick-add popup here (removed per owner feedback; Location Master, Module M, still has its own
  // screen for anyone who wants to manage the list directly). Typing an unrecognized name and saving still
  // works — saveLoadingChallan() silently remembers it in Location Master so it appears as a suggestion
  // next time, without ever showing an "Add Location" prompt.
  attachAutocomplete('ac_loadpoint_input','ac_loadpoint_sugg', locations, (item)=>{ draft.loadingPoint=item.name; }, l=>locationLabel(l.id));
  const loadPointInput = document.getElementById('ac_loadpoint_input');
  if(loadPointInput) loadPointInput.addEventListener('input', ()=>{ draft.loadingPoint = loadPointInput.value; });
  attachAutocomplete('ac_unloadpoint_input','ac_unloadpoint_sugg', locations, (item)=>{ draft.unloadingPoint=item.name; }, l=>locationLabel(l.id));
  const unloadPointInput = document.getElementById('ac_unloadpoint_input');
  if(unloadPointInput) unloadPointInput.addEventListener('input', ()=>{ draft.unloadingPoint = unloadPointInput.value; });
  attachAutocomplete('ac_cparty_input','ac_cparty_sugg', parties, (item)=>{
      draft.partyId=item.id;
      draft.partyName=partyLabel(item.id);
      if(!draft.partyNumber){
        draft.partyNumber = item.contact||'';
        const numEl = document.getElementById('f_partyNumber');
        if(numEl) numEl.value = draft.partyNumber;
      }
    }, p=>partyLabel(p.id),
    {kindLabel:'Party', onAdd:(q)=>quickAddFromChallan('party','partyId',q,'Party')});
  // Party doesn't have to resolve to a Party Master record — the booking call may use a different/informal
  // name. Capture whatever's typed as free text; if it stops matching the previously selected party, drop
  // the stale link so we don't save a mismatched id+name pair (the correct master party gets picked properly
  // later, when converting this Challan into a Bilty).
  const cPartyInput = document.getElementById('ac_cparty_input');
  if(cPartyInput) cPartyInput.addEventListener('input', ()=>{
    draft.partyName = cPartyInput.value;
    if(draft.partyId && partyLabel(draft.partyId) !== cPartyInput.value) draft.partyId = '';
  });
  attachAutocomplete('ac_csupplier_input','ac_csupplier_sugg', parties, (item)=>{
    draft.supplierId=item.id; draft.supplierName=partyLabel(item.id);
    const hintWrap = document.getElementById('csupplierHintWrap');
    if(hintWrap) hintWrap.innerHTML = csupplierHintHtml();
  }, p=>partyLabel(p.id),
  {kindLabel:'Supplier', onAdd:(q)=>quickAddFromChallan('party','supplierId',q,'Supplier',{type:'Supplier'})},
  null,
  {label:'🏢 Self'+(companyProfile.companyName?' ('+companyProfile.companyName+')':'')+' — we own this truck', onSelect:()=>{
    draft.supplierId=''; draft.supplierName='Self'+(companyProfile.companyName?' ('+companyProfile.companyName+')':'');
    document.getElementById('ac_csupplier_input').value = draft.supplierName;
    const hintWrap = document.getElementById('csupplierHintWrap');
    if(hintWrap) hintWrap.innerHTML = csupplierHintHtml();
  }});
  const cSupplierInput = document.getElementById('ac_csupplier_input');
  if(cSupplierInput) cSupplierInput.addEventListener('input', ()=>{
    draft.supplierName = cSupplierInput.value;
    if(draft.supplierId && partyLabel(draft.supplierId) !== cSupplierInput.value) draft.supplierId = '';
  });
  // Round 23q: Broker (optional) — same Party-Master-linked search + quick-add pattern as Party/Supplier above.
  // The input's displayed value always resolves via partyLabel(draft.loadBrokerId) first (same as the Party
  // field), so a quick-added Broker shows correctly the moment we return here — no separate name-patch needed
  // in returnToChallanWithNew() the way Party Number needed for Round 23p.
  attachAutocomplete('ac_cbroker_input','ac_cbroker_sugg', parties, (item)=>{
    draft.loadBrokerId=item.id; draft.loadBrokerName=partyLabel(item.id);
  }, p=>partyLabel(p.id),
  {kindLabel:'Broker', onAdd:(q)=>quickAddFromChallan('party','loadBrokerId',q,'Broker',{type:'Broker'})});
  const cBrokerInput = document.getElementById('ac_cbroker_input');
  if(cBrokerInput) cBrokerInput.addEventListener('input', ()=>{
    draft.loadBrokerName = cBrokerInput.value;
    if(draft.loadBrokerId && partyLabel(draft.loadBrokerId) !== cBrokerInput.value) draft.loadBrokerId = '';
  });
}
function addChallanNote(){ draft.notes.push(''); renderLoadingChallanForm(); }
function removeChallanNote(i){ draft.notes.splice(i,1); renderLoadingChallanForm(); }
function updateChallanMargin(){
  const h=Number(draft.hireRate)||0, b=Number(draft.bookingRate)||0, w=Number(draft.weight)||0;
  const el = document.getElementById('challanMarginOut');
  if(el) el.textContent = '₹'+((b-h)*w).toLocaleString('en-IN');
}
function saveLoadingChallan(){
  const truckId = draft.truckId, partyId = draft.partyId;
  // Truck, like Party, doesn't have to resolve to a master record at booking time (owner's explicit
  // decision — the whole point of the Loading Challan is a fast entry from a phone call) — accept
  // whatever was typed as free text if it was never picked/quick-added from Truck Master.
  const truckNumber = toTruckCase((document.getElementById('ac_ctruck_input').value||'').trim() || draft.truckNumber || '');
  const partyName = toTitleCase((document.getElementById('ac_cparty_input').value||'').trim() || draft.partyName || '');
  const loadingPoint = (document.getElementById('ac_loadpoint_input').value||'').trim();
  const unloadingPoint = (document.getElementById('ac_unloadpoint_input').value||'').trim();
  const hireRate = document.getElementById('f_hireRate').value;
  const bookingRate = document.getElementById('f_bookingRate').value;
  if(!(truckId||truckNumber) || !(partyId||partyName) || !loadingPoint || !unloadingPoint || !hireRate || !bookingRate || !draft.biltyNeeded){
    // Named per missing field (instead of one blanket message) so it's always clear exactly what's
    // still needed — a generic combined message previously made it easy to misread which field the
    // app was actually still waiting on.
    const missing = [];
    if(!(truckId||truckNumber)) missing.push('Truck Number');
    if(!(partyId||partyName)) missing.push('Party name');
    if(!loadingPoint) missing.push('Loading Point');
    if(!unloadingPoint) missing.push('Unloading Point');
    if(!hireRate) missing.push('Truck Hire Rate');
    if(!bookingRate) missing.push('Truck Booking Rate');
    if(!draft.biltyNeeded) missing.push('Bilty Needed (Yes/No)');
    toast('Please fill: ' + missing.join(', ')); return;
  }
  const supplierName = toTitleCase((document.getElementById('ac_csupplier_input').value||'').trim());
  const loadBrokerName = toTitleCase((document.getElementById('ac_cbroker_input').value||'').trim());
  const rec = {
    id: draft.id || nextId.challan++,
    serialNo: document.getElementById('f_serial').value, date: document.getElementById('f_date').value,
    truckId: truckId||'', truckNumber, driverMobile: document.getElementById('f_driverMobile').value, ownerMobile: document.getElementById('f_ownerMobile').value,
    ownerName: toTitleCase(document.getElementById('f_ownerName').value),
    loadingPoint, unloadingPoint, hireRate, hireRateType: draft.hireRateType||'PerMT', bookingRate, bookingRateType: draft.bookingRateType||'PerMT', partyId: partyId||'', partyName,
    partyNumber: document.getElementById('f_partyNumber').value, weight: document.getElementById('f_weight').value, biltyNeeded: draft.biltyNeeded,
    notes: draft.notes.filter(n=>n.trim()), linkedBiltyId: draft.linkedBiltyId||'', linkedFreightChallanId: draft.linkedFreightChallanId||'',
    supplierId: draft.supplierId||'', supplierName,
    loadBrokerId: draft.loadBrokerId||'', loadBrokerName,
    // Round 23s: carried forward explicitly (this object is built field-by-field, not spread from draft) so
    // editing an already-cancelled challan's other details never silently clears its cancelled state/reason.
    cancelled: draft.cancelled||false, cancelReason: draft.cancelReason||'', cancelledAt: draft.cancelledAt||''
  };
  if(draft.id){ loadingChallans = loadingChallans.map(c=>c.id===draft.id?rec:c); } else { loadingChallans.push(rec); }
  rememberLocation(loadingPoint, 'Loading');
  rememberLocation(unloadingPoint, 'Unloading');
  toast('Loading Challan saved');
  openLoadingChallanDetail(rec.id);
  screen = 'loadingChallanDetail';
  render();
}
function openLoadingChallanDetail(id){ draft = loadingChallans.find(c=>c.id==id); }

    </div>

      ${c.loadBrokerName ? (()=>{ const bp = c.loadBrokerId ? parties.find(p=>p.id==c.loadBrokerId) : null; return `

    </div>

let cancelChallanCtx = null;
// Round 23s: Cancel Challan feature — opens an in-app reason form (never a browser prompt/confirm, per this
// app's established pattern) so the owner can record WHY a booked truck never went for loading, for future
// reference/tracking, exactly as asked.
function openCancelChallanForm(id){
  const c = loadingChallans.find(x=>x.id==id);
  if(!c) return;
  cancelChallanCtx = {id, reason:''};
  go('cancelChallanForm');
}
function renderCancelChallanForm(){
  const ctx = cancelChallanCtx;
  const c = ctx ? loadingChallans.find(x=>x.id==ctx.id) : null;
  if(!c){ go('loadingChallanList'); return; }
  syncChrome('Cancel Challan', challanTruckLabel(c), true);
  document.getElementById('fab').style.display='none'; setMoreMenu([]);
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="li-title" style="font-size:16px;">🚛 ${esc(challanTruckLabel(c))}</div>
      <div class="li-sub">${c.serialNo} &nbsp;·&nbsp; ${c.date}</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">Why is this Challan being cancelled?</div>
      <div class="field-hint">This truck didn't go for loading, or the booking otherwise fell through. The reason is saved for future reference — it can't be edited later.</div>
      <label class="field-label">Reason <span class="req">*</span></label>
      <textarea id="cancel_reason" rows="3" placeholder="e.g. Truck owner backed out, party cancelled the load, rate dispute..." oninput="cancelChallanCtx.reason=this.value"></textarea>
      <button class="btn-primary" style="margin-top:10px;color:#d33;" onclick="confirmCancelChallan()">✕ Confirm Cancel</button>
      <button class="btn-secondary" onclick="openLoadingChallanDetail(${c.id});go('loadingChallanDetail')">Back</button>
    </div>
  `;
}
function confirmCancelChallan(){
  const ctx = cancelChallanCtx;
  if(!ctx) return;
  const c = loadingChallans.find(x=>x.id==ctx.id);
  if(!c) return;
  const reason = (ctx.reason||'').trim();
  if(!reason){ toast('Please enter a reason for cancelling'); return; }
  c.cancelled = true;
  c.cancelReason = reason;
  c.cancelledAt = new Date().toISOString().slice(0,10);
  cancelChallanCtx = null;
  toast('Challan cancelled');
  openLoadingChallanDetail(c.id);
  screen = 'loadingChallanDetail';
  render();
}
function createBiltyFromChallan(id){
  const c = loadingChallans.find(x=>x.id==id);
  if(!c) return;
  convertingFromChallanId = id;
  const bookingAmount = c.bookingRateType==='Fixed' ? (Number(c.bookingRate)||0) : (Number(c.bookingRate)||0)*(Number(c.weight)||0);
  draft = {
    biltyNo:'LT-'+(1000+nextId.bilty), date:new Date().toISOString().slice(0,10),
    // Consignor AND Consignee both default from the Loading Challan's single Party field (owner's explicit
    // Round 20 decision — Party field itself stays as-is, but both roles start pre-filled from it since a
    // Loading Challan only tracks one counterparty), each still fully editable/re-pickable below.
    consignorId: c.partyId||'', consignorNameHint: c.partyId ? '' : (c.partyName||''),
    consigneeId: c.partyId||'', consigneeNameHint: c.partyId ? '' : (c.partyName||''),
    thirdPartyId:'',
    // Truck may only have been a free-text number on the Loading Challan (see saveLoadingChallan) — carry
    // that forward as a hint the same way Consignor/Consignee do, since the Bilty's own Truck field still
    // requires a real Truck Master link (search & pick, or quick-add) to save.
    truckId: c.truckId||'', truckNumberHint: c.truckId ? '' : (c.truckNumber||''), driverId:'',
    goods:[{productId:'', qty:'', unit:'', weight:c.weight||''}],
    // Hire/Booking Rate/Type carried over — Hire Rate so it's available if this Bilty needs to show your
    // own cost (Round 22, off by default, see showHireRate), Booking Rate so the Freight Amount below can
    // keep recalculating live if the Weight is corrected here — the Loading Challan's weight was only ever
    // a booking-time record, not the final one.
    hireRate: c.hireRate||'', hireRateType: c.hireRateType||'PerMT',
    bookingRate: c.bookingRate||'', bookingRateType: c.bookingRateType||'PerMT',
    // Round 23t: defaults to "Yes" (bill at Booking Rate, unchanged behavior) — only switched to "No" by hand
    // when the party/broker has actually agreed to a different rate for this specific load.
    billAtBookingRate:'Yes', biltyRate:'', biltyRateType: c.bookingRateType||'PerMT',
    freight: bookingAmount||'', advance:'0', advances:[], charges:[],
    paymentType:'To-Pay', showFreight:'Yes', showHireRate:'No', showBookingRate:'No', showAdvance:'No', showExpenses:'No', tripCompleted:false,
    // Round 23p: this Remarks pre-fill deliberately no longer bakes in the Loading Challan's own Notes — those
    // used to get saved permanently into the Bilty's own `remarks` field, which meant they kept showing on the
    // Bilty's printed/summary Detail view forever, even though they were only ever meant for the office's own
    // reference at data-entry time. The Notes are now shown as a separate, read-only reference block on this
    // Bilty Form only (see renderBiltyForm's sourceChallanId lookup), computed fresh from the Loading Challan
    // and never written into any saved Bilty field — so they help while entering the Bilty (so the party can be
    // asked about them if needed) without leaking onto the summary a driver, party, or anyone else might see.
    remarks: `Loading Point: ${c.loadingPoint||'—'} → Unloading Point: ${c.unloadingPoint||'—'}`,
    ewayBillDoc:'', invoiceDoc:'', otherDocs:[], // added Round 17 — must be present or renderBiltyForm()'s document section crashes
    sourceChallanId: id // so the Bilty can later offer "Create Freight Challan" (Path 2 — Loading Challan → Bilty → Freight Challan)
  };
  go('biltyForm');
  toast('Challan details carried into the new Bilty — pick Consignee & Driver to continue' + (c.partyId ? '' : ' (and confirm the correct Consignor)'));
}

function updateBalance(){
  const f=Number(draft.freight)||0, a=biltyAdvanceTotal(draft);
  // Round 23l: for To-Pay, Expenses fold into the running total the same way the full re-render does (see
  // renderBiltyForm's totalFreight) — this lightweight DOM-only patch has to match that same math, or the
  // figure shown here would drift out of sync with what a full re-render (e.g. adding an Expense) computes.
  const total = draft.paymentType==='To-Pay' ? f + biltyChargesTotal(draft) : f;
  const el = document.getElementById('balanceOut');
  if(el) el.textContent = '₹'+(total-a).toLocaleString('en-IN');

// Round 23w: the "Show Booking Rate?" toggle on the printed Bilty (and its live form preview) previously
// always showed the Booking Rate field's own value when switched on, AND separately showed a second "Bilty
// Rate" row underneath whenever the Bill-the-Party-at-Booking-Rate override was active — regardless of the
// toggle. So with the override on and "Show Booking Rate?" = Yes, the party-facing document showed BOTH the
// business's own internal Booking Rate (which the owner never wanted leaking out here) and the real Bilty
// Rate, instead of just the one rate the party should actually see. This now collapses to a single row, still
// gated purely by "Show Booking Rate?", carrying whichever rate is actually in effect — the Bilty Rate when
// the override is active, the plain Booking Rate otherwise — so only the real, correct rate is ever shown.
function biltyShownRateRow(b){
  if((b.showBookingRate||'No')!=='Yes') return '';
  const useOverride = b.billAtBookingRate==='No' && Number(b.biltyRate)>0;
  const rate = useOverride ? b.biltyRate : b.bookingRate;
  if(!rate) return '';
  const rateType = useOverride ? b.biltyRateType : b.bookingRateType;
  return `<div class="summary-row"><span>Booking Rate${rateType==='Fixed'?' (Fixed)':' (₹/MT)'}</span><span>₹${Number(rate).toLocaleString('en-IN')}</span></div>`;
}
// Recomputes Freight Amount from the Goods Weight(s) × Booking Rate whenever either changes — only when a
// Booking Rate is actually known (i.e. this Bilty was converted from a Loading Challan). A from-scratch Bilty
// with no Booking Rate keeps Freight Amount fully manual, exactly as before. The Freight Amount input stays
// directly editable too, so an override still works — it just won't survive a further Weight/Rate change.
function recalcBiltyFreight(){
  // Round 23t: when the party/broker's rate differs from the Booking Rate (billAtBookingRate==='No'), the
  // Bilty's own Freight Amount — what's actually billed to the party — now recalculates off the separate
  // Bilty Rate instead. The truck's own Hire Rate is never touched by this; see computeFreightChallanCalc()
  // for the matching change on the Freight Challan side (the party-recovery figure, not the driver's own).
  const useOverride = draft.billAtBookingRate==='No';
  const rate = useOverride ? (Number(draft.biltyRate)||0) : (Number(draft.bookingRate)||0);
  const rateType = useOverride ? (draft.biltyRateType||'PerMT') : (draft.bookingRateType||'PerMT');
  if(!rate) return;
  const totalWeight = draft.goods.reduce((s,g)=>s+(Number(g.weight)||0),0);
  draft.freight = rateType==='Fixed' ? String(rate) : String(Math.round(rate*totalWeight));
}
function saveBilty(){
  const consignorId = draft.consignorId, consigneeId = draft.consigneeId, truckId = draft.truckId, driverId = draft.driverId;
  const freight = document.getElementById('f_freight').value;
  if(!consignorId || !consigneeId || !truckId || !driverId || !freight){
    toast('Please select Consignor, Consignee, Truck, Driver from suggestions and enter Freight'); return;
  }
  const thirdPartyId = draft.thirdPartyId||'';
  // Round 23k: "Third Party" used to silently get downgraded to "Consignor" here if no Third Party contact
  // was linked above — meant to guard against saving an unresolvable role, but it also meant picking "Third
  // Party" in the dropdown could quietly save as something else entirely. It's now kept exactly as selected,
  // same as "Other" (which has never required a linked record either) — freightPayerLabel() below already
  // displays it gracefully with no name suffix when no Third Party is linked.
  const freightPaidByRole = draft.freightPaidByRole||'Consignor';
  const rec = {
    id: draft.id || nextId.bilty++, biltyNo: document.getElementById('f_biltyNo').value,
    date: document.getElementById('f_date').value, consignorId, consigneeId, thirdPartyId, truckId, driverId,
    goods: draft.goods.filter(g=>g.productId),
    hireRate: draft.hireRate||'', hireRateType: draft.hireRateType||'PerMT',
    bookingRate: draft.bookingRate||'', bookingRateType: draft.bookingRateType||'PerMT',
    billAtBookingRate: draft.billAtBookingRate||'Yes',
    biltyRate: draft.billAtBookingRate==='No' ? (draft.biltyRate||'') : '',
    biltyRateType: draft.biltyRateType||'PerMT',
    freight, advance: '0', advances: draft.advances||[], charges: draft.charges||[],
    paymentType: draft.paymentType, showFreight: draft.paymentType==='To-Pay' ? 'Yes' : (draft.showFreight||'No'),
    showHireRate: draft.showHireRate||'No', showBookingRate: draft.showBookingRate||'No', showAdvance: draft.showAdvance||'No',
    showExpenses: draft.paymentType==='To-Pay' ? 'Yes' : (draft.showExpenses||'No'),
    freightPaidByRole, freightPaidByOtherLabel: freightPaidByRole==='Other' ? (draft.freightPaidByOtherLabel||'') : '',
    tripCompleted: draft.tripCompleted||false,
    remarks: document.getElementById('f_remarks').value, sourceChallanId: draft.sourceChallanId||'',
    ewayBillDoc: draft.ewayBillDoc||'', invoiceDoc: draft.invoiceDoc||'', otherDocs: draft.otherDocs||[]
  };
  if(draft.id){ bilties = bilties.map(b=>b.id===draft.id?rec:b); } else { bilties.push(rec); }

    const ch = loadingChallans.find(c=>c.id===convertingFromChallanId);
    if(ch) ch.linkedBiltyId = rec.id;
    convertingFromChallanId = null;
  }
  syncBiltyAdvancesToFreightChallan(rec);
  toast('Bilty saved'); goBack(); renderBiltyList();
}

        ${b.advances.map(a=>`<div class="summary-row"><span>${a.mode}${a.date?' · '+a.date:''}</span><span>₹${(Number(a.amount)||0).toLocaleString('en-IN')}</span></div>`).join('')}
      ` : ''}
      ${b.remarks ? `<div class="field-hint" style="margin-top:8px;white-space:pre-line;">📝 ${esc(b.remarks)}</div>` : ''}
    </div>
    ${(b.ewayBillDoc || b.invoiceDoc || (b.otherDocs&&b.otherDocs.length)) ? `
      <div class="section-title">Documents</div>
      <div class="upload-row">
        ${b.ewayBillDoc ? `<div class="upload-chip">📄 ${b.ewayBillDoc}</div>` : ''}
        ${b.invoiceDoc ? `<div class="upload-chip">📄 ${b.invoiceDoc}</div>` : ''}
        ${(b.otherDocs||[]).map(d=>`<div class="upload-chip">📄 ${d}</div>`).join('')}
      </div>
    ` : ''}
    <button class="btn-secondary" onclick="toast('PDF generated (prototype)')">⬇ Export as PDF</button>
    <button class="btn-secondary" onclick="toast('Share sheet opened (prototype)')">↗ Share via WhatsApp</button>
    ${(()=>{ const linkedFcId = biltyLinkedFreightChallanId(b); const pod = findPodRecord(b.id, linkedFcId);
      if(pod){
        return `<button class="btn-secondary" onclick="openPodDetail(${pod.id});go('podDetail')">📦 View/Edit POD ${pod.status==='Received'?'(Received)':'(Not Received)'}</button>`;
      }
      return `<button class="btn-primary" onclick="openPodForm(${b.id}, ${linkedFcId||"''"})">✅ Mark Trip Completed (POD Received)</button>`;
